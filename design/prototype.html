<script>
/* ===== Engine: Shilp Ratnakar rules. Internal unit = angul (1 angul = 0.75", 1 gaj = 24 angul = 18"); never displayed. ===== */
const ceil = x => Math.max(0, Math.ceil(x - 1e-6));
const IN = a => a * 0.75;
const ftin = i => `${Math.floor(i / 12)}′-${i % 12}″`;
const f1 = n => n.toLocaleString('en-IN', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const rs = n => '₹ ' + Math.round(n).toLocaleString('en-IN');
// value at g0 is v0; then +inc per gaj up to each breakpoint
function stepFrom(G, g0, v0, segs){ let v = v0, prev = g0; for (const [upto, inc] of segs){ if (G > prev) v += inc * (Math.min(G, upto) - prev); prev = upto; } return v; }
function interp(G, pts){ if (G <= pts[0][0]) return pts[0][1] * G / pts[0][0]; for (let i = 1; i < pts.length; i++){ const [g1, v1] = pts[i-1], [g2, v2] = pts[i]; if (G <= g2) return v1 + (v2 - v1) * (G - g1) / (g2 - g1); } return pts[pts.length-1][1]; }
const low = (G, f) => G < 1 ? f(1) * G : f(G);
const R = {
  kurmashila: G => low(G, g => stepFrom(g, 1, 4, [[10,2],[20,1],[50,.5]])),
  kurma:      G => low(G, g => stepFrom(g, 1, .5, [[15,.5],[31,.25],[50,.125]])),
  disha:      G => low(G, g => stepFrom(g, 1, 7, [[5,2],[10,1],[20,.75],[50,.5]])),
  bhit1:      G => low(G, g => stepFrom(g, 1, 4, [[50,.5]])),
  pith1:      G => low(G, g => stepFrom(g, 1, 12, [[5,5],[10,4],[20,3],[36,1.5],[50,.75]])),
  pith2:      G => G <= 5 ? interp(G, [[1,12],[2,16],[3,18],[4,27.5],[5,30]]) : stepFrom(G, 5, 30, [[10,4],[20,3],[36,2],[50,1]]),
  jagApa:     G => G <= 4 ? interp(G, [[1,24],[2,36],[3,48],[4,60]]) : stepFrom(G, 4, 60, [[12,12],[24,8],[50,6]]),
  jagMan:     G => low(G, g => stepFrom(g, 1, 12, [[12,12],[22,8],[32,6],[50,4.75]])),
  man1:       G => G <= 5 ? interp(G, [[1,38],[2,62],[3,79],[4,101],[5,123]]) : stepFrom(G, 5, 123, [[10,14],[30,12],[50,9]]),
  man2:       G => G <= 5 ? 24 * G : stepFrom(G, 5, 120, [[30,12],[50,9]]),
  man3:       G => interp(G, [[1,33],[2,55],[3,77],[4,97],[5,120],[6,142],[7,161],[8,176],[9,187],[10,192],[15,246],[20,300],[25,354],[30,408],[35,510],[40,516],[45,570],[50,600]]),
  man4:       G => G <= 5 ? 24 * G : stepFrom(G, 5, 120, [[13,12],[21,11],[50,10]]),

function tharRows(list, totalIn, keep){
  const sum = list.reduce((a, t) => a + t[1], 0), unit = totalIn / sum;
  const rows = list.map(([n, b, nk]) => ({n, b, h: Math.max(1, ceil(b * unit)), nik: ceil((nk || 0) * unit)}));
  if (keep){ const rest = rows.slice(0, -1).reduce((a, r) => a + r.h, 0); rows[rows.length-1].h = Math.max(1, ceil(totalIn) - rest); }
  return {rows, sum, unit, total: rows.reduce((a, r) => a + r.h, 0), book: ceil(totalIn)};
}

    <div class="field"><label for="rate">પથ્થર નો દર</label><div class="box"><em style="margin-right:6px">₹</em><input id="rate" class="num" inputmode="numeric" value="${p.rate}" data-in="rate"><em>/ ઘન ફૂટ</em></div></div>
    <div class="field"><div class="lb">થર નો સરવાળો</div>${seg('m.keep', p.m.keep, [[false,'રાઉન્ડ નો સરવાળો'],[true,'ગ્રંથ ની ઊંચાઈ રાખો']])}</div>
  </div></div>
  <div class="live"><small>આપોઆપ ગણતરી</small>
    <div class="r"><small>પ્રાસાદ (કર્ણ થી કર્ણ)</small><b>${c.P}″ · ${ftin(c.P)}</b></div>
    <div class="r"><small>દીવાલ ની જાડાઈ</small><b>${c.t}″ · ${ftin(c.t)}</b></div>
    <div class="r"><small>મંડોવર ઊંચાઈ</small><b>${c.mando}″ · ${ftin(c.mando)}</b></div>
    <div class="r"><small>કુલ પથ્થર</small><b>${f1(c.total)} CFT</b></div>

  ${c.warn.map(w => `<div class="warn"><span>⚠</span><div>${w}</div></div>`).join('')}`;
}

function elev(T){
  const H = 470, top = 16, x = 62, w = 130; let y = top + H, o = '';
  T.rows.forEach((r, i) => { const h = r.h / T.total * H; y -= h; const nk = Math.min(r.nik * 1.4, 26), big = r.n.startsWith('જંઘા');
    o += `<rect x="${x - nk}" y="${y}" width="${w + 2*nk}" height="${h}" fill="${big ? 'var(--accent-soft)' : i % 2 ? 'var(--surface2)' : 'var(--surface)'}" stroke="var(--ink)" stroke-width=".8"/>`;
    if (h > 12) o += `<text x="${x + w + 32}" y="${y + h/2 + 4}" font-size="10.5" fill="var(--ink)">${r.n}</text><text x="${x - 30}" y="${y + h/2 + 4}" font-size="10.5" text-anchor="end" fill="var(--muted)" font-family="Inter,sans-serif">${r.h}″</text>`; });
  o += `<line x1="12" y1="${top}" x2="12" y2="${top + H}" stroke="var(--accent)" stroke-width="1.4"/>`;
  return `<svg viewBox="0 0 340 500" role="img" aria-label="થર નું ચિત્ર">${o}</svg>`;
}

  const head = `<div class="bar"><div><div class="crumb">ભાગ › ${pt.name}</div><h1>${pt.name}</h1></div><span class="sp"></span>${styleBar()}</div>
    <div class="ppick">${c.parts.map(x => `<button class="chip ${x.key === pt.key ? 'on' : ''}" data-part="${x.key}">${x.name}</button>`).join('')}</div>
    <div class="bar"><div class="tabs" role="tablist"><button role="tab" class="${S.tab === 'maap' ? 'on' : ''}" data-tab="maap">માપ</button><button role="tab" class="${S.tab === 'stone' ? 'on' : ''}" data-tab="stone">પથ્થર</button></div><span class="sp"></span><span class="src">${pt.src}</span></div>
    <div class="kpis">${pt.kpis.map(([l, v, s, cl]) => `<div class="kpi"><small>${l}</small><b class="${cl || ''}">${v}</b><span>${s || ''}</span></div>`).join('')}
      <div class="kpi acc"><small>પથ્થર</small><b>${f1(pt.cft)} CFT</b><span class="num">${rs(pt.cft * p.rate)}</span></div></div>

  let body = '';
  if (S.tab === 'maap'){
    if (pt.jagIn) body += `<div class="card"><div class="bd"><div class="lb" style="font-size:13px;color:var(--muted);margin-bottom:6px">જગતી નું માપ (લંબાઈ × પહોળાઈ, ફૂટ માં)</div><div class="row" style="max-width:420px"><div class="box"><input id="jlf" class="num" inputmode="numeric" value="${p.jl ? Math.round(p.jl/12) : ''}" placeholder="લંબાઈ" data-in="jlf"><em>ફૂટ</em></div><span style="color:var(--muted)">×</span><div class="box"><input id="jwf" class="num" inputmode="numeric" value="${p.jw ? Math.round(p.jw/12) : ''}" placeholder="પહોળાઈ" data-in="jwf"><em>ફૂટ</em></div></div></div></div>`;
    if (pt.thar){ const T = pt.thar;
      body += `<div class="split"><div class="card elev">${elev(T)}</div><div class="card"><div class="hd"><h2>થર પ્રમાણે માપ</h2></div><div class="sx"><table><thead><tr><th>#</th><th>થર</th><th class="r">ભાગ</th><th class="r">ઊંચાઈ</th><th class="r">નિકાળો</th></tr></thead><tbody>
        ${T.rows.map((r, i) => `<tr><td class="num" style="color:var(--muted)">${i+1}</td><td>${r.n}</td><td class="r num">${r.b}</td><td class="r num"><b>${r.h}″</b><span class="fi">${ftin(r.h)}</span></td><td class="r num">${r.nik ? r.nik + '″' : '—'}</td></tr>`).reverse().join('')}
        <tr class="tot"><td></td><td>કુલ</td><td class="r num">${T.sum || ''}</td><td class="r num">${T.total}″<span class="fi">${ftin(T.total)}</span></td><td></td></tr></tbody></table></div></div></div>`;
      if (T.book && T.total !== T.book) body += `<div class="warn"><span>⚠</span><div>દરેક થર ઉપર ના આખા ઇંચ માં ગણ્યો છે, એટલે સરવાળો <b class="num">${T.total}″</b> થાય છે; ગ્રંથ ની ઊંચાઈ <b class="num">${T.book}″</b> છે. "માહિતી" માં "ગ્રંથ ની ઊંચાઈ રાખો" પસંદ કરી શકાય.</div></div>`;
    } else {
      body += `<div class="card"><div class="sx"><table><thead><tr><th>માપ</th><th class="r">ઇંચ</th><th class="r">ફૂટ-ઇંચ</th><th>આધાર</th></tr></thead><tbody>
        ${pt.meas.map(([l, v, n]) => typeof v === 'number' ? `<tr><td>${l}</td><td class="r num"><b>${v}″</b></td><td class="r num">${ftin(v)}</td><td style="color:var(--muted);font-size:13px">${n}</td></tr>` : `<tr><td>${l}</td><td class="r" colspan="2"><b>${v}</b></td><td style="color:var(--muted);font-size:13px">${n}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
  } else {
    body += pt.stone.length ? `<div class="card"><div class="hd"><h2>લંબાઈ × પહોળાઈ × ઊંચાઈ × નંગ</h2><span class="sp"></span><button class="btn" data-act="addrow">+ લાઇન ઉમેરો</button></div><div class="sx"><table><thead><tr><th>વસ્તુ</th><th class="r">લંબાઈ ″</th><th class="r">પહોળાઈ ″</th><th class="r">ઊંચાઈ ″</th><th class="r">નંગ</th><th class="r">રનિંગ ફૂટ</th><th class="r">ઘન ફૂટ</th></tr></thead><tbody>
      ${pt.stone.map((r, i) => { const ex = r[5], base = pt.stone.filter(x => !x[5]).length, k = ex ? `x:${i - base}` : `o:${i}`;
        return `<tr><td>${ex ? `<input class="e en" id="s-${k}-n" value="${esc(r[0])}" data-st="${pt.key}:${k}:0" aria-label="વસ્તુ">` : r[0]}</td>${[1,2,3,4].map(j => `<td class="r"><input class="e" id="s-${k}-${j}" inputmode="numeric" value="${r[j]}" data-st="${pt.key}:${k}:${j}" aria-label="${['','લંબાઈ','પહોળાઈ','ઊંચાઈ','નંગ'][j]}"></td>`).join('')}<td class="r num">${f1(r[1]*r[4]/12)}</td><td class="r num"><b>${f1(r[1]*r[2]*r[3]*r[4]/1728)}</b></td></tr>`; }).join('')}
      <tr class="tot"><td>કુલ ${pt.name}</td><td></td><td></td><td></td><td></td><td></td><td class="r num">${f1(pt.cft)}</td></tr></tbody></table></div></div>
      <p style="color:var(--muted);font-size:13px;margin:0">દરેક ખાનું હાથ થી બદલી શકાય. ઘન ફૂટ = લંબાઈ × પહોળાઈ × ઊંચાઈ × નંગ ÷ 1728.</p>`
      : `<div class="card"><div class="bd" style="color:var(--muted)">${pt.key === 'jagati' ? '"માપ" ટેબ માં જગતી ની લંબાઈ-પહોળાઈ નાખો, પછી પથ્થર ગણાશે.' : 'આ ભાગ માં અલગ પથ્થર ની લાઇન નથી.'} <button class="btn" data-act="addrow" style="margin-left:8px">+ લાઇન ઉમેરો</button></div></div>`;
  }
  return head + body + pt.warn.map(w => `<div class="warn"><span>⚠</span><div>${w}</div></div>`).join('');
}

function vSummary(p, c){
  const mx = Math.max(1, ...c.parts.map(x => x.cft));
  return `<div class="bar"><div><div class="crumb">${esc(p.name)}</div><h1>સારાંશ</h1></div><span class="sp"></span>${styleBar()}</div>
  <div class="kpis"><div class="kpi"><small>ગર્ભગૃહ</small><b>${ftin(ceil(p.gw))}</b><span class="num">× ${ftin(ceil(p.gd))}</span></div><div class="kpi"><small>પ્રાસાદ</small><b>${ftin(c.P)}</b><span class="num">${c.P}″</span></div>
    <div class="kpi"><small>કુલ પથ્થર</small><b>${f1(c.total)}</b><span>ઘન ફૂટ</span></div><div class="kpi acc"><small>કુલ ખર્ચ</small><b>${rs(c.total * p.rate)}</b><span class="num">${rs(p.rate)} / CFT</span></div></div>
  <div class="card"><div class="hd"><h2>ભાગ પ્રમાણે પથ્થર</h2></div><div class="bd">${c.parts.map(x => `<div class="hb" data-part="${x.key}" tabindex="0"><span>${x.name}</span><div class="tr"><div class="fl" style="width:${x.cft / mx * 100}%"></div></div><span class="v num">${x.cft ? f1(x.cft) + ' CFT' : '—'}</span></div>`).join('')}
    <div class="hb" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px;cursor:default"><b>કુલ</b><span></span><b class="v num">${f1(c.total)} CFT</b></div></div></div>
  <div class="card"><div class="sx"><table><thead><tr><th>ભાગ</th><th class="r">ઘન ફૂટ</th><th class="r">ખર્ચ</th></tr></thead><tbody>${c.parts.map(x => `<tr><td>${x.name}</td><td class="r num">${f1(x.cft)}</td><td class="r num">${rs(x.cft * p.rate)}</td></tr>`).join('')}<tr class="tot"><td>કુલ</td><td class="r num">${f1(c.total)}</td><td class="r num">${rs(c.total * p.rate)}</td></tr></tbody></table></div></div>`;
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function render(){
  document.body.dataset.style = S.style;
  const p = cur(), c = compute(p), v = S.view;
  if (S.style === 'b') return renderB(p, c), save();
  if (S.style === 'c') return renderC(p, c), save();
  if (S.style === 'd') return renderD(p, c), save();
  const nav = (id, t) => `<a class="${v === id ? 'on' : ''}" data-nav="${id}" tabindex="0">${t}</a>`;
  document.getElementById('root').innerHTML = `<div class="app">
    <aside class="rail"><div class="brand"><div class="logo">${ic.temple}</div><div><b>બૃહદ્ ટેમ્પલ એસ્ટીમેટ</b><small>શિલ્પ રત્નાકર આધારિત</small></div></div>
      ${nav('projects', 'બધા પ્રોજેક્ટ')}${nav('input', 'માહિતી')}${nav('summary', 'સારાંશ')}
      <div class="lab">ભાગ — નીચે થી ઉપર</div>
      ${c.parts.map(x => `<a class="${v === 'part' && S.part === x.key ? 'on' : ''}" data-part="${x.key}" tabindex="0">${x.name}<span class="c num">${x.cft ? f1(x.cft) : '—'}</span></a>`).join('')}
      ${LATER.map(n => `<a class="off">${n}<span class="c">પછી</span></a>`).join('')}</aside>
    <main class="main"><div class="wrap">${v === 'projects' ? vProjects() : v === 'input' ? vInput(p, c) : v === 'summary' ? vSummary(p, c) : vPart(p, c)}</div></main></div>
    <nav class="bnav" aria-label="મુખ્ય">${[['projects','પ્રોજેક્ટ',ic.grid],['input','માહિતી',ic.edit],['part','ભાગ',ic.temple.replace(/20/g,'22')],['summary','સારાંશ',ic.chart]].map(([id, t, i]) => `<button class="${v === id ? 'on' : ''}" data-nav="${id}">${i}${t}</button>`).join('')}</nav>`;
  save();
}

/* ===== Events ===== */
const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) && n >= 0 ? n : 0; };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tog],[data-style],[data-nav],[data-part],[data-tab],[data-set],[data-act],[data-del],[data-open]'); if (!t) return;
  const p = cur(), d = t.dataset;
  if (d.tog){ S.open = S.open || {}; S.open[d.tog] = S.open[d.tog] === false; }
  else if (d.style) S.style = d.style;
  else if (d.del !== undefined){ S.projects.splice(+d.del, 1); S.cur = 0; }
  else if (d.nav) S.view = d.nav;
  else if (d.part){ S.part = d.part; S.view = 'part'; }
  else if (d.tab) S.tab = d.tab;
  else if (d.set){ const path = d.set.split('.').slice(1); let v = d.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (!isNaN(v) && v !== '') v = +v;
    let o = p; for (let i = 0; i < path.length - 1; i++) o = o[path[i]]; o[path[path.length-1]] = v; p.ov = {}; }
  else if (d.act === 'new'){ S.projects.push(newProj('નવું મંદિર ' + (S.projects.length + 1))); S.cur = S.projects.length - 1; S.view = 'input'; }
  else if (d.act === 'addrow'){ (p.extra[S.part] = p.extra[S.part] || []).push(['નવી લાઇન', 12, 12, 12, 1]); S.tab = 'stone'; }
  else if (d.open !== undefined){ S.cur = +d.open; S.view = 'input'; }
  render(); if (d.top) window.scrollTo(0,0); if (d.nav || d.part || d.open !== undefined) window.scrollTo(0, 0);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('a[data-nav],a[data-part],.hb,.pc')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target, p = cur(), c = compute(p);
  if (t.dataset.in){ const k = t.dataset.in, g = id => num((document.getElementById(id) || {}).value);
    if (k === 'name') p.name = t.value || 'મંદિર';
    else if (k[0] === 'g'){ p.gw = Math.max(12, g('gwf') * 12 + g('gwi')); p.gd = Math.max(12, g('gdf') * 12 + g('gdi')); p.ov = {}; }
    else if (k === 'face') p.face = Math.max(1, ceil(num(t.value)));
    else if (k === 'rate') p.rate = num(t.value);
    else if (k === 'jlf' || k === 'jwf'){ p.jl = g('jlf') * 12; p.jw = g('jwf') * 12; }
    else p[k] = t.value;
  } else if (t.dataset.st){ const [pk, kind, i, j] = t.dataset.st.split(':'), pt = c.parts.find(x => x.key === pk);
    if (kind === 'x'){ const row = p.extra[pk][+i]; row[+j] = +j === 0 ? t.value : ceil(num(t.value)); }
    else { const r = pt.stone[+i].slice(1, 5); r[+j - 1] = ceil(num(t.value)); p.ov[pk + ':' + i] = r; }
  } else return;
  const id = t.id; render(); const el = id && document.getElementById(id); if (el) el.focus();
});

/* ===== Layout 2: drawing-first (CAD sheet) ===== */
function quick(p, c){
  const fi = (id, v, u) => `<div class="box q"><input id="${id}" class="num" inputmode="numeric" value="${v}" data-in="${id}"><em>${u}</em></div>`;
  return `<div class="row qk"><span class="ql">ગર્ભગૃહ</span>${fi('gwf', Math.floor(p.gw/12), 'ફૂટ')}${fi('gwi', ceil(p.gw%12), 'ઇંચ')}<span>×</span>${fi('gdf', Math.floor(p.gd/12), 'ફૂટ')}${fi('gdi', ceil(p.gd%12), 'ઇંચ')}
    <div class="box q"><select id="jati" data-in="jati">${JATI.map(([v, t]) => `<option value="${v}" ${v === p.jati ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="box q"><em>₹</em><input id="rate" class="num" inputmode="numeric" value="${p.rate}" data-in="rate"><em>/CFT</em></div></div>`;
}
function stack(c, sel){
  const keys = ['jagati','pith','bhit','mandovar'];
  const H = {jagati: c.parts[3].thar.total, bhit: c.parts[1].thar.total, pith: c.parts[2].thar.total, mandovar: c.parts[4].thar.total};
  const shik = Math.round(c.P * 1.33); const tot = H.jagati + H.bhit + H.pith + H.mandovar + shik;
  const VH = 620, sc = VH / tot, cx = 210, Pw = Math.min(220, 220);
  let y = 650, o = '';
  const band = (k, h, w, label) => { const hh = h * sc; y -= hh; const on = sel === k;
    o += `<g class="bd2" data-part="${k}"><rect x="${cx - w/2}" y="${y}" width="${w}" height="${hh}" fill="${on ? 'var(--accent-soft)' : 'var(--surface)'}" stroke="${on ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${on ? 2 : 1}"/>
      <text x="${cx + w/2 + 14}" y="${y + hh/2 + 4}" font-size="13" fill="var(--ink)">${label}</text><text x="${cx - w/2 - 12}" y="${y + hh/2 + 4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="Inter">${h}″</text></g>`; };
  band('jagati', H.jagati, 380, 'જગતી'); band('bhit', H.bhit, 270, 'ભીત'); band('pith', H.pith, 250, 'પીઠ');
  // mandovar with thars
  { const hh = H.mandovar * sc, top = y - hh, on = sel === 'mandovar'; let yy = y;
    o += `<g class="bd2" data-part="mandovar">`;
    c.parts[4].thar.rows.forEach(r => { const h = r.h * sc; yy -= h; const nk = r.nik * sc * 1.5; o += `<rect x="${cx - Pw/2 - nk}" y="${yy}" width="${Pw + 2*nk}" height="${h}" fill="${on ? 'var(--accent-soft)' : 'var(--surface)'}" stroke="${on ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${on ? 1.4 : .7}"/>`; });
    const dh = c.parts[6].kpis[0][1].replace('″','') * sc, dw = c.parts[6].kpis[1][1].replace('″','') * sc;
    o += `<rect x="${cx - dw/2}" y="${y - dh}" width="${dw}" height="${dh}" fill="var(--bg)" stroke="var(--ink)" stroke-width=".8" data-part="dwar" class="bd2"/>`;
    o += `<text x="${cx + Pw/2 + 14}" y="${top + hh/2 + 4}" font-size="13" fill="var(--ink)">મંડોવર</text><text x="${cx - Pw/2 - 12}" y="${top + hh/2 + 4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="Inter">${H.mandovar}″</text></g>`;

    return `<path d="${curve(cx, yb, bw, h, sk)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw}"/>${[.25,.5,.75].map(f => `<line x1="${cx - (bw/2 - (bw-sk)/2*f*f)}" y1="${Y(yb + h*f)}" x2="${cx + (bw/2 - (bw-sk)/2*f*f)}" y2="${Y(yb + h*f)}" stroke="var(--muted)" stroke-width="${sw*.5}"/>`).join('')}
      <rect x="${cx - aw/2}" y="${Y(yb + h + ah*.7)}" width="${aw}" height="${ah*.5}" rx="${ah*.25}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw*.8}"/>
      <path d="M${cx - kw/2} ${Y(yb + h + ah*.7)} Q ${cx - kw*.7} ${Y(yb + h + ah*.7 + kw*.8)} ${cx} ${Y(yb + h + ah*.7 + kw*1.4)} Q ${cx + kw*.7} ${Y(yb + h + ah*.7 + kw*.8)} ${cx + kw/2} ${Y(yb + h + ah*.7)} Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw*.8}"/>`; };
  o += `<g data-part="shikhar" class="hit">`;
  o += `<path d="${curve(X0, yS0, Bw, Sh, Sk)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw*1.2}"/>`;
  // rekha lines (padhro / bhadra) following curve, and bhumi bands
  segs.slice(1).forEach(sg => { const fx = sg.a / (Bw/2);
    o += `<path d="M${X0 + sg.a} ${Y(yS0)} C ${X0 + sg.a} ${Y(yS0 + Sh*.55)}, ${X0 + fx*(Sk/2 + Sk*.12)} ${Y(yS0 + Sh*.93)}, ${X0 + fx*Sk/2} ${Y(yS0 + Sh)}" fill="none" stroke="var(--muted)" stroke-width="${sw*.6}"/>`; });
  for (let k = 1; k < 9; k++){ const f = k/9, half = Bw/2 - (Bw - Sk)/2 * Math.pow(f, 2.2);
    o += `<line x1="${X0 - half}" y1="${Y(yS0 + Sh*f)}" x2="${X0 + half}" y2="${Y(yS0 + Sh*f)}" stroke="var(--muted)" stroke-width="${sw*.4}" opacity=".7"/>`; }
  // karna shrung + urushrung on bhadra
  const ks = segs[0].w;
  o += mini(X0 + segs[0].a + ks*.5, yS0, ks*1.05, Sh*.32) + mini(X0 + segs[segs.length-1].a + ks*.5, yS0, ks*1.05, Sh*.32);
  const bh = segs.find(sg => sg.n === 'ભદ્ર'); if (bh){ o += mini(X0, yS0 + Sh*.18, bh.w*1.25, Sh*.52) + mini(X0, yS0, bh.w*1.05, Sh*7/13*.62); }
  // amalsaro (griva 3/4, amalsaro 5/4, chandrika 1, amalsari 1 of Ah/4)
  { const q = Ah/4; let yy = yS0 + Sh;
    o += `<rect x="${X0 - Aw*.36}" y="${Y(yy + q*.75)}" width="${Aw*.72}" height="${q*.75}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw}"/>`; yy += q*.75;
    o += `<rect x="${X0 - Aw/2}" y="${Y(yy + q*1.25)}" width="${Aw}" height="${q*1.25}" rx="${q*.6}" fill="var(--surface2)" stroke="var(--ink)" stroke-width="${sw}"/>`;
    for (let k = -Aw/2 + Aw/14; k < Aw/2; k += Aw/14) o += `<line x1="${X0 + k}" y1="${Y(yy + q*.15)}" x2="${X0 + k}" y2="${Y(yy + q*1.1)}" stroke="var(--muted)" stroke-width="${sw*.5}"/>`; yy += q*1.25;
    o += `<rect x="${X0 - Aw*.42}" y="${Y(yy + q)}" width="${Aw*.84}" height="${q}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw}"/>`; yy += q;
    o += `<rect x="${X0 - Aw*.3}" y="${Y(yy + q)}" width="${Aw*.6}" height="${q}" rx="${q*.4}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw}"/>`; yy += q;
    // kalash: 9 high x 6 wide grid
    const u = Kh/9, v = Kw/6;
    const ys = [yy, yy+u, yy+4*u, yy+5*u, yy+6*u, yy+9*u];
    o += `<path d="M${X0 - 2*v} ${Y(ys[0])} L ${X0 - 2*v} ${Y(ys[1])} C ${X0 - 3.4*v} ${Y(ys[1] + u*.4)}, ${X0 - 3.4*v} ${Y(ys[2] - u*.4)}, ${X0 - 1*v} ${Y(ys[2])} L ${X0 - 2*v} ${Y(ys[3])} L ${X0 - 1.5*v} ${Y(ys[4])} Q ${X0 - 1.6*v} ${Y(ys[4] + 1.6*u)} ${X0} ${Y(ys[5])} Q ${X0 + 1.6*v} ${Y(ys[4] + 1.6*u)} ${X0 + 1.5*v} ${Y(ys[4])} L ${X0 + 2*v} ${Y(ys[3])} L ${X0 + 1*v} ${Y(ys[2])} C ${X0 + 3.4*v} ${Y(ys[2] - u*.4)}, ${X0 + 3.4*v} ${Y(ys[1] + u*.4)}, ${X0 + 2*v} ${Y(ys[1])} L ${X0 + 2*v} ${Y(ys[0])} Z" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="${sw}"/>`;
    // dhwajdand at back-right padhro
    const dx = X0 + Sk*.42, d0 = yS0 + Sh*.9, d1 = d0 + Dl*.55;
    o += `<line x1="${dx}" y1="${Y(d0)}" x2="${dx}" y2="${Y(d1)}" stroke="var(--ink)" stroke-width="${sw*2}"/><path d="M${dx} ${Y(d1)} q ${Dl*.18} ${Dl*.02} ${Dl*.32} ${Dl*.1} q -${Dl*.12} ${Dl*.02} -${Dl*.2} ${Dl*.12} q -${Dl*.06} -${Dl*.05} -${Dl*.12} -${Dl*.1}" fill="var(--accent)" opacity=".85"/>`;
  }
  o += `</g>`;
  // dimension chain on left
  const dims = [['જગતી', 0, yJ], ['ભીત + પીઠ', yJ, yM0], ['મંડોવર', yM0, yS0], ['શિખર', yS0, yS0 + Sh], ['આમલસારો + કલશ', yS0 + Sh, yS0 + Sh + Ah + Kh]];
  const dx = X0 + jl0 - 70;
  dims.forEach(([n, a, b]) => { o += `<line x1="${dx}" y1="${Y(a)}" x2="${dx}" y2="${Y(b)}" stroke="var(--accent)" stroke-width="${sw*1.2}"/><line x1="${dx - 8}" y1="${Y(a)}" x2="${dx + 8}" y2="${Y(a)}" stroke="var(--accent)" stroke-width="${sw*1.2}"/>
    ${b - a > fs*2.4 ? `<text x="${dx - fs*.5}" y="${Y((a+b)/2)}" font-size="${fs}" fill="var(--accent)" text-anchor="middle" font-family="Inter,sans-serif" transform="rotate(-90 ${dx - fs*.5} ${Y((a+b)/2)})">${fmtDim(b - a)}</text>` : ''}`; });
  const dx2 = dx - fs*2.6, tt = yS0 + Sh + Ah + Kh;
  o += `<line x1="${dx2}" y1="${Y(0)}" x2="${dx2}" y2="${Y(tt)}" stroke="var(--ink)" stroke-width="${sw}"/><line x1="${dx2 - 8}" y1="${Y(tt)}" x2="${dx2 + 8}" y2="${Y(tt)}" stroke="var(--ink)" stroke-width="${sw}"/>
    <text x="${dx2 - fs*.5}" y="${Y(tt/2)}" font-size="${fs*1.1}" fill="var(--ink)" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" transform="rotate(-90 ${dx2 - fs*.5} ${Y(tt/2)})">${fmtDim(tt)}</text>`;
  // part labels right
  const lx = X0 + jr0 + 46;
  [['જગતી', yJ/2], ['પીઠ', (yJ + yM0)/2], ['મંડોવર', (yM0 + yS0)/2], ['શિખર', yS0 + Sh/2]].forEach(([n, yy]) => o += `<text x="${lx}" y="${Y(yy) + fs*.35}" font-size="${fs}" fill="var(--muted)">${n}</text>`);
  // bottom width
  o += `<text x="${X0}" y="${Y(0) + fs*1.4}" font-size="${fs*.9}" fill="var(--muted)" text-anchor="middle" font-family="Inter,sans-serif">પ્રાસાદ ${fmtDim(P)} · જગતી ${fmtDim(jagW)}${p.jl > 0 ? '' : ' (અંદાજ)'}</text>`;
  const minX = dx2 - fs*2;
  return `<svg class="dw" viewBox="${minX} 0 ${W + 160 - minX} ${Ht + fs*2}" role="img" aria-label="એલિવેશન">${o}</svg>`;
}

function planSVG(p, c, sel){
  const P = c.P, D = c.Pd, t = c.t, info = planInfo(p, c);
  const sx = sideOffsets(P, info), sy = sideOffsets(D, info);
  const dw = c.parts.find(x => x.key === 'dwar'), doorW = +dw.kpis[1][1].replace('″','');
  const MPp = c.parts.find(x => x.key === 'mandap'), mand = +MPp.meas[0][1], swp = +c.parts.find(x => x.key === 'stambh').kpis[0][1].replace('″','');
  const fs = Math.max(P, D + mand) / 26, sw = fs / 9;
  // outline polygon clockwise, front (bottom, +y) side gets door
  const pts = [];
  sx.forEach(sg => { pts.push([sg.a, -D/2 - sg.pj], [sg.z, -D/2 - sg.pj]); });                // back (top)
  sy.forEach(sg => { pts.push([P/2 + sg.pj, sg.a], [P/2 + sg.pj, sg.z]); });                  // right
  sx.slice().reverse().forEach(sg => { pts.push([sg.z, D/2 + sg.pj], [sg.a, D/2 + sg.pj]); }); // front
  sy.slice().reverse().forEach(sg => { pts.push([-P/2 - sg.pj, sg.z], [-P/2 - sg.pj, sg.a]); }); // left
  const mg = fs * 5, minX = -P/2 - mg - fs*3, minY = -D/2 - mg - fs*2, W = P + 2*mg + fs*6, H = D + mand + 2*mg + fs*4;
  const on = sel === 'deewal';
  let o = '';
  // mandap (later phase) dashed
  o += `<rect x="${-mand/2}" y="${D/2 + P*.12}" width="${mand}" height="${mand*.9}" fill="${sel === 'mandap' ? 'var(--accent-soft)' : 'none'}" stroke="${sel === 'mandap' ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${sw*1.2}" data-part="mandap" class="hit"/>
    ${[0,1,2,3].flatMap(i => [0,1,2,3].map(j => (i === 0 || i === 3 || j === 0 || j === 3) ? `<rect x="${-mand/2 + swp/2 + (mand - swp*2)*i/3}" y="${D/2 + P*.12 + swp/2 + (mand*.9 - swp*2)*j/3}" width="${swp}" height="${swp}" fill="${sel === 'stambh' ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--ink)" stroke-width="${sw}" data-part="stambh" class="hit"/>` : '')).join('')}
    <circle cx="0" cy="${D/2 + P*.12 + mand*.45}" r="${mand*.2}" fill="none" stroke="var(--muted)" stroke-dasharray="${fs*.4} ${fs*.3}" stroke-width="${sw}" data-part="ghummat" class="hit"/>
    <text x="0" y="${D/2 + P*.12 + mand*.45 + fs*.35}" font-size="${fs}" fill="var(--muted)" text-anchor="middle">મંડપ ${fmtDim(mand)}</text>
    <rect x="${-doorW*1.2}" y="${D/2}" width="${doorW*2.4}" height="${P*.12}" fill="none" stroke="var(--muted)" stroke-width="${sw}"/>`;
  o += `<g data-part="deewal" class="hit"><path d="M${pts.map(q => q.join(' ')).join(' L ')} Z M${-ceil(p.gw)/2} ${-ceil(p.gd)/2} L ${ceil(p.gw)/2} ${-ceil(p.gd)/2} L ${ceil(p.gw)/2} ${ceil(p.gd)/2} L ${-ceil(p.gw)/2} ${ceil(p.gd)/2} Z" fill-rule="evenodd" fill="${on ? 'var(--accent-soft)' : 'var(--surface2)'}" stroke="${on ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${sw*1.6}"/></g>`;
  // door opening
  o += `<g data-part="dwar" class="hit"><rect x="${-doorW/2}" y="${ceil(p.gd)/2 - sw}" width="${doorW}" height="${(D - ceil(p.gd))/2 + sw*2 + 2}" fill="var(--bg)" stroke="none"/>
    <line x1="${-doorW/2}" y1="${ceil(p.gd)/2}" x2="${-doorW/2}" y2="${D/2 + (sx.find(s => s.n === 'ભદ્ર') || {pj:0}).pj}" stroke="var(--ink)" stroke-width="${sw*1.2}"/><line x1="${doorW/2}" y1="${ceil(p.gd)/2}" x2="${doorW/2}" y2="${D/2 + (sx.find(s => s.n === 'ભદ્ર') || {pj:0}).pj}" stroke="var(--ink)" stroke-width="${sw*1.2}"/></g>`;
  // inside label + kurmashila (center)
  o += `<text x="0" y="${-fs*.6}" font-size="${fs*1.15}" text-anchor="middle" fill="var(--ink)" font-weight="600">ગર્ભગૃહ</text>
    <text x="0" y="${fs*1}" font-size="${fs}" text-anchor="middle" fill="var(--muted)" font-family="Inter,sans-serif">${fmtDim(p.gw)} × ${fmtDim(p.gd)}</text>`;
  // dimension chain on top: segments
  const yd = -D/2 - mg*.55, yd2 = -D/2 - mg*.95;
  sx.forEach(sg => o += `<line x1="${sg.a}" y1="${yd - fs*.3}" x2="${sg.a}" y2="${yd + fs*.3}" stroke="var(--accent)" stroke-width="${sw}"/><text x="${(sg.a + sg.z)/2}" y="${yd - fs*.35}" font-size="${fs*.8}" text-anchor="middle" fill="var(--accent)" font-family="Inter,sans-serif">${fmtDim(sg.w)}</text>`);
  o += `<line x1="${-P/2}" y1="${yd}" x2="${P/2}" y2="${yd}" stroke="var(--accent)" stroke-width="${sw}"/><line x1="${P/2}" y1="${yd - fs*.3}" x2="${P/2}" y2="${yd + fs*.3}" stroke="var(--accent)" stroke-width="${sw}"/>`;
  o += `<line x1="${-P/2}" y1="${yd2}" x2="${P/2}" y2="${yd2}" stroke="var(--ink)" stroke-width="${sw}"/><text x="0" y="${yd2 - fs*.4}" font-size="${fs*.95}" text-anchor="middle" fill="var(--ink)" font-family="Inter,sans-serif" font-weight="600">${fmtDim(P)} (કર્ણ થી કર્ણ)</text>`;
  // left: depth + wall
  const xd = -P/2 - mg*.6;
  o += `<line x1="${xd}" y1="${-D/2}" x2="${xd}" y2="${D/2}" stroke="var(--ink)" stroke-width="${sw}"/><text x="${xd - fs*.5}" y="0" font-size="${fs*.95}" text-anchor="middle" fill="var(--ink)" font-family="Inter,sans-serif" transform="rotate(-90 ${xd - fs*.5} 0)">${fmtDim(D)}</text>`;
  // wall thickness callout right
  const xr = P/2 + fs*.2;
  o += `<line x1="${ceil(p.gw)/2}" y1="${-D/4}" x2="${P/2}" y2="${-D/4}" stroke="var(--accent)" stroke-width="${sw}"/><text x="${(ceil(p.gw)/2 + P/2)/2}" y="${-D/4 - fs*.4}" font-size="${fs*.8}" text-anchor="middle" fill="var(--accent)" font-family="Inter,sans-serif">${t}″</text>`;
  o += `<text x="${-P/2}" y="${minY + H - fs*.6}" font-size="${fs*.8}" fill="var(--muted)">${info.label} · કર્ણ / પઢરો / ભદ્ર ના નિકાળા સાથે</text>`;
  return `<svg class="dw" viewBox="${minX} ${minY} ${W} ${H}" role="img" aria-label="પ્લાન">${o}</svg>`;
}

const drawCard = (title, svg, src) => `<div class="card dcard"><div class="hd"><h2>${title}</h2><span class="sp"></span>${src ? `<span class="src">${src}</span>` : ''}</div><div class="dbody">${svg}</div></div>`;

function vHome(p, c){
  const key = x => x.kpis[0];
  const fi = (id, v, u) => `<div class="box"><input id="${id}" class="num" inputmode="numeric" value="${v}" data-in="${id}"><em>${u}</em></div>`;
  return `<div class="hero"><div class="hl"><small>${esc(p.name)}</small><h1 class="num">${rs(c.total * p.rate)}</h1><div class="hs num">${f1(c.total)} ઘન ફૂટ પથ્થર · ${rs(p.rate)} / CFT</div></div>
      <div class="hr num"><div><small>પ્રાસાદ</small><b>${ftin(c.P)}</b></div><div><small>દીવાલ</small><b>${c.t}″</b></div><div><small>મંડોવર</small><b>${ftin(c.mando)}</b></div></div></div>
    <div class="card"><div class="bd row"><span class="ql">ગર્ભગૃહ</span>${fi('gwf', Math.floor(p.gw/12), 'ફૂટ')}${fi('gwi', ceil(p.gw%12), 'ઇંચ')}<span style="color:var(--muted)">×</span>${fi('gdf', Math.floor(p.gd/12), 'ફૂટ')}${fi('gdi', ceil(p.gd%12), 'ઇંચ')}<button class="btn" data-nav="input">બધી માહિતી →</button></div></div>
    <div class="tiles">${c.parts.map(x => `<button class="tile" data-part="${x.key}"><span class="tn">${x.name}</span><span class="tk num">${key(x)[1]}</span><span class="ts">${key(x)[0]}</span><span class="tc num">${x.cft ? f1(x.cft) + ' CFT · ' + rs(x.cft * p.rate) : '—'}</span></button>`).join('')}</div>
    <div class="dpair">${drawCard('એલિવેશન', elevSVG(p, c, null))}${drawCard('પ્લાન', planSVG(p, c, null))}</div>`;
}
function vDraw(p, c){
  return `<div class="bar"><div><div class="crumb">${esc(p.name)}</div><h1>ચિત્ર</h1></div><span class="sp"></span><span class="crumb">ભાગ પર ક્લિક કરો</span></div>
    <div class="dpair big">${drawCard('એલિવેશન', elevSVG(p, c, S.part), 'શિલ્પ રત્નાકર મુજબ')}${drawCard('પ્લાન', planSVG(p, c, S.part), planInfo(p, c).label)}</div>`;
}
function render(){
  const p = cur(), c = compute(p);
  let v = S.view; if (!['home','input','draw','part','summary','projects'].includes(v)) v = S.view = 'home';
  document.body.dataset.style = 'a';
  const nav = (id, t) => `<a class="${v === id ? 'on' : ''}" data-nav="${id}" tabindex="0">${t}</a>`;
  let main;
  if (v === 'home') main = vHome(p, c);
  else if (v === 'input') main = vInput(p, c);
  else if (v === 'draw') main = vDraw(p, c);
  else if (v === 'summary') main = vSummary(p, c);
  else if (v === 'projects') main = vProjects();
  else { main = vPart(p, c); const pt = c.parts.find(x => x.key === S.part) || c.parts[4];
    const dr = ['deewal','mandap'].includes(pt.key) ? drawCard('પ્લાન', planSVG(p, c, pt.key)) : drawCard('એલિવેશન', elevSVG(p, c, pt.key));
    main = main.replace(/<div class="card elev">[\s\S]*?<\/svg><\/div>/, '<div class="pdraw">' + dr + '</div>');
    if (!pt.thar && S.tab === 'maap') main += `<div class="pdraw solo">${dr}</div>`; }
  document.getElementById('root').innerHTML = `<div class="app">
    <aside class="rail"><div class="brand"><div class="logo">${ic.temple}</div><div><b>બૃહદ્ ટેમ્પલ એસ્ટીમેટ</b><small>${esc(p.name)}</small></div></div>
      ${nav('home', 'ડેશબોર્ડ')}${nav('input', 'માહિતી')}${nav('draw', 'ચિત્ર (એલિવેશન / પ્લાન)')}${nav('summary', 'સારાંશ')}${nav('projects', 'બધા પ્રોજેક્ટ')}
      <div class="lab">ભાગ — નીચે થી ઉપર</div>
      ${c.parts.map(x => `<a class="${v === 'part' && S.part === x.key ? 'on' : ''}" data-part="${x.key}" tabindex="0">${x.name}<span class="c num">${x.cft ? f1(x.cft) : '—'}</span></a>`).join('')}
      ${LATER.map(n => `<a class="off">${n}<span class="c">પછી</span></a>`).join('')}
      <div class="railtot num"><small>કુલ</small><b>${f1(c.total)} CFT</b><span>${rs(c.total * p.rate)}</span></div></aside>
    <main class="main"><div class="wrap">${main}</div></main></div>
    <nav class="bnav" aria-label="મુખ્ય">${[['home','ડેશબોર્ડ',ic.chart],['input','માહિતી',ic.edit],['draw','ચિત્ર',ic.temple.replace(/20/g,'22')],['projects','પ્રોજેક્ટ',ic.grid]].map(([id, t, i]) => `<button class="${v === id ? 'on' : ''}" data-nav="${id}">${i}${t}</button>`).join('')}</nav>`;
  save();
}
S.view = 'home';
render();
</script>
