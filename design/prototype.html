<title>Brihad Temple Estimate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;500;600;700&family=Baloo+Bhai+2:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Mukta+Vaani:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — parts rail on the left, working area on the right; phone = bottom tabs + part chips.
   Four switchable looks (data-style on body): 1 Indigo, 2 Graphite, 3 Paper, 4 Teal. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#eef0f6; --line:#dfe3ec; --ink:#161a26; --muted:#667085;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e8e9fd; --warn:#b45309; --warn-soft:#fdf2df;
  --side-bg:#ffffff; --side-ink:#161a26; --side-muted:#667085; --side-on:#e8e9fd; --side-on-ink:#4f46e5; --side-line:#dfe3ec;
  --radius:14px; --radius-s:10px; --shadow:0 1px 2px rgba(22,26,38,.05),0 6px 20px rgba(22,26,38,.06);
  --font:"Inter","Noto Sans Gujarati",system-ui,sans-serif; --head:"Noto Sans Gujarati","Inter",system-ui,sans-serif; --num:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1117; --surface:#181b24; --surface2:#20242f; --line:#2c3140; --ink:#eef0f6; --muted:#98a1b3;
  --accent:#8b8cf8; --accent-ink:#0f1117; --accent-soft:#25264a; --warn:#fbbf24; --warn-soft:#3a2f14;
  --side-bg:#181b24; --side-ink:#eef0f6; --side-muted:#98a1b3; --side-on:#25264a; --side-on-ink:#a5a6ff; --side-line:#2c3140;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1117; --surface:#181b24; --surface2:#20242f; --line:#2c3140; --ink:#eef0f6; --muted:#98a1b3;
  --accent:#8b8cf8; --accent-ink:#0f1117; --accent-soft:#25264a; --warn:#fbbf24; --warn-soft:#3a2f14;
  --side-bg:#181b24; --side-ink:#eef0f6; --side-muted:#98a1b3; --side-on:#25264a; --side-on-ink:#a5a6ff; --side-line:#2c3140;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer} input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){.btn,.chip,.rail a,.seg button,.card{transition:background .15s,color .15s,border-color .15s,transform .15s}}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.rail{background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--side-line);padding:16px 12px;display:flex;flex-direction:column;gap:12px;align-self:stretch;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px}
.logo{width:36px;height:36px;border-radius:var(--radius-s);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
body[data-style="d"] .logo{border-radius:12px}
.brand b{display:block;font-family:var(--head);font-size:15.5px;line-height:1.25}.brand small{color:var(--side-muted);font-size:12px}
.rail .lab{font-size:11.5px;color:var(--side-muted);padding:6px 10px 0;letter-spacing:.04em}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-s);font-size:14.5px;cursor:pointer;min-height:40px}
.rail a:hover{background:color-mix(in srgb,var(--side-on) 55%,transparent)}
.rail a.on{background:var(--side-on);color:var(--side-on-ink);font-weight:600}
.rail a .c{margin-left:auto;font-size:12px;color:var(--side-muted)} .rail a.on .c{color:inherit}
.rail a.off{color:var(--side-muted);cursor:default} .rail a.off:hover{background:transparent}

.main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px;min-width:0}
.wrap>*{min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:23px;line-height:1.2}.crumb{color:var(--muted);font-size:13px}
.sp{flex:1}
.styles{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 6px 4px 12px;font-size:13px;color:var(--muted)}
.styles button{border:0;background:transparent;min-width:34px;min-height:34px;border-radius:var(--radius-s);font-family:var(--num);font-weight:600}
.styles button.on{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 16px;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.dan{color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips .l{font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;min-height:38px}
body[data-style="c"] .chip{border-radius:3px}
.chip:hover{border-color:var(--accent)} .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .hd h2{font-size:16px}.card .bd{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-width:0}
.kpi small{color:var(--muted);font-size:12.5px;display:block}.kpi b{font-size:21px;display:block;font-family:var(--num);overflow-wrap:anywhere}
.kpi b.t{font-family:var(--head);font-size:18px}.kpi span{color:var(--muted);font-size:12.5px}
.kpi.acc{background:var(--accent);border-color:transparent;color:var(--accent-ink)}.kpi.acc small,.kpi.acc span{color:inherit;opacity:.85}
.src{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.warn{display:flex;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-s);padding:10px 14px;font-size:13.5px}
body[data-style="d"] .warn{border-radius:16px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:var(--radius-s)}
.tabs button{border:0;background:transparent;padding:8px 20px;border-radius:var(--radius-s);color:var(--muted);min-height:40px}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sx{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line)} td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0} tr.tot td{font-weight:700;background:var(--surface2)}
.fi{color:var(--muted);font-size:12.5px;display:block}
td input.e{width:64px;text-align:right;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px 6px;font-family:var(--num)}
td input.e:hover,td input.e:focus{border-style:solid;border-color:var(--accent)}
td input.en{width:150px;text-align:left;font-family:var(--font)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.split>*{min-width:0}
.split.in{grid-template-columns:minmax(0,1fr) 320px}
.elev{padding:12px}.elev svg{width:100%;height:auto;display:block;max-height:540px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.form>*{min-width:0}.full{grid-column:1/-1}
.field>label,.field>.lb{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{flex:1 1 84px;display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);padding:0 14px;min-height:46px;min-width:0}
.box:focus-within{border-color:var(--accent)}
.box input,.box select{border:0;background:transparent;outline:0;width:100%;min-width:0;font-size:16px;font-family:var(--num)}
.box select{font-family:var(--font)}
.box em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;min-height:46px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.live{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:18px;display:grid;gap:10px}
body[data-style="b"] .live{background:var(--surface2);color:var(--ink);border:1px solid var(--accent)}
.live .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid color-mix(in srgb,currentColor 18%,transparent);padding-bottom:8px}
.live small{opacity:.75}.live b{font-family:var(--num);font-size:17px;text-align:right}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pc{padding:16px;display:grid;gap:10px;cursor:pointer}.pc.on{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.pc h3{font-size:16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.meta div{background:var(--surface2);border-radius:var(--radius-s);padding:8px 12px}body[data-style="d"] .meta div{border-radius:14px}
.meta small{display:block;color:var(--muted);font-size:12px}
.hb{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:8px 0;cursor:pointer}
.hb .tr{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}.hb .fl{height:100%;background:var(--accent);border-radius:99px}
.hb .v{text-align:right;font-size:13.5px}
.bnav,.ppick{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)} .rail{display:none}
  .bar h1{font-size:20px}.kpis{grid-template-columns:1fr 1fr}.split,.split.in,.form{grid-template-columns:minmax(0,1fr)}
  .hb{grid-template-columns:92px minmax(0,1fr) 84px}
  .ppick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.ppick .chip{white-space:nowrap;flex:none}
  .tabs{width:100%}.tabs button{flex:1}
  .elev svg{max-height:400px}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:50px;border-radius:var(--radius-s)}
  .bnav button.on{color:var(--accent);font-weight:600}
}

/* ---- Layout 2: drawing-first CAD sheet ---- */

.lb2{padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-width:1400px;margin:0 auto}
.hb2,.hd4{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tot2{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}.tot2 span{color:var(--muted);font-size:12.5px}.tot2 b{font-size:18px}
.qk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.qk .ql{font-size:13px;color:var(--muted)} .box.q{flex:0 1 110px;min-height:40px}
.g2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  background-image:linear-gradient(var(--surface2) 1px,transparent 1px),linear-gradient(90deg,var(--surface2) 1px,transparent 1px);background-size:20px 20px;position:sticky;top:12px}
.sheet-hd{display:flex;justify-content:space-between;padding:10px 12px;font-size:12px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
.cad{width:100%;height:auto;display:block;max-height:72vh}.bd2{cursor:pointer}.bd2:hover rect{stroke:var(--accent)}
.det2{display:grid;gap:12px;min-width:0}.det2 .bar h1{font-size:22px}
.det2 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .det2 .split{grid-template-columns:minmax(0,1fr)} .det2 .elev{display:none}
/* ---- Layout 3: tiles ---- */

.lc{padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;max-width:1100px;margin:0 auto}
.hc{display:grid;gap:12px}
.hero{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:20px 22px}
.hero small{opacity:.75}.hero h1{font-size:36px;font-family:var(--num);margin:2px 0}.hero .hs{opacity:.8;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-height:118px;align-content:start}
.tile:hover{border-color:var(--accent)} .tile.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tile .tn{font-family:var(--head);font-size:17px;font-weight:600}.tile .tk{font-size:22px;font-weight:700}.tile .ts{font-size:12px;opacity:.7}.tile .tc{font-size:13px;margin-top:4px;opacity:.85}
.tile.off{opacity:.5;box-shadow:none;border-style:dashed;background:transparent}
.sheetc{background:var(--surface);border-radius:var(--radius);padding:16px;display:grid;gap:12px;border:1px solid var(--line);min-width:0}
/* ---- Layout 4: BOQ sheet ---- */

.ld{display:grid;min-height:100%}
.hd4{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--ink)}
.g4{display:grid;grid-template-columns:290px minmax(0,1fr)}
.inp4{border-right:1px solid var(--line);padding:12px 16px;display:grid;gap:8px;align-content:start;background:var(--surface2)}
.dh{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.dl{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:4px}.dl:empty{display:none}
.inp4 .box{min-height:38px}.inp4 .seg button{min-height:36px;font-size:13px}
.sum4{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.sum4 div{background:var(--surface);border:1px solid var(--line);padding:6px 8px}.sum4 small{display:block;color:var(--muted);font-size:11.5px}
.boq{min-width:0;padding:0}.boq table{font-size:13.5px}.boq th{position:sticky;top:0;background:var(--surface);z-index:1}
.boq td{padding:5px 10px}.boq tr.grp td{background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;padding:8px 10px}
.boq tr.grp .src{background:transparent;color:inherit;opacity:.6;font-weight:400}.boq td.it{padding-left:28px}
.boq tfoot td{font-weight:700;font-size:15px;border-top:2px solid var(--ink);padding:10px}.boq .e{width:62px}
@media (max-width:860px){.g2,.g4{grid-template-columns:minmax(0,1fr)}.sheet{position:static}.inp4{border-right:0}.hero h1{font-size:28px}.tiles{grid-template-columns:1fr 1fr}}

.hero{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.hero .hr{display:flex;gap:22px;flex-wrap:wrap}.hero .hr small{display:block;opacity:.7;font-size:12px}.hero .hr b{font-size:19px}
.ql{font-size:13px;color:var(--muted)}
.tile .tk{font-family:var(--num)}
.dpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.dpair>*{min-width:0}
.dcard .dbody{padding:10px;background-image:linear-gradient(var(--surface2) 1px,transparent 1px),linear-gradient(90deg,var(--surface2) 1px,transparent 1px);background-size:22px 22px;border-radius:0 0 var(--radius) var(--radius)}
svg.dw{width:100%;height:auto;display:block;max-height:640px}.dpair.big svg.dw{max-height:78vh}
.hit{cursor:pointer}.hit:hover rect,.hit:hover path,.hit:hover polygon{stroke:var(--accent)}
.pdraw .card{box-shadow:none}.pdraw.solo{max-width:560px}
.railtot{margin-top:auto;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-s);padding:10px 12px;display:grid}.railtot small{opacity:.8;font-size:12px}.railtot b{font-size:18px}.railtot span{font-size:13px;opacity:.9}
@media (max-width:860px){.dpair{grid-template-columns:minmax(0,1fr)}.hero .hr{gap:14px}}
.themes{margin-top:8px}.themes button{min-height:38px;font-size:13px}
.thm{display:none;float:right;min-height:34px;padding:4px 12px;background:transparent;color:inherit;border-color:currentColor}
@media (max-width:860px){.thm{display:inline-flex}}
.hero{background:#161a26;color:#f5f6fa}:root[data-theme="dark"] .hero{background:#232838}

.ibtn{border:1px solid var(--side-line);background:transparent;color:var(--side-ink);width:34px;height:34px;border-radius:999px;flex:none;font-size:15px}
.ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail a{min-height:36px;padding:7px 10px}
.grp{display:grid;gap:1px}.gh{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--side-ink);padding:7px 10px;border-radius:var(--radius-s);font-weight:600;font-size:14px;min-height:36px}
.gh:hover{background:color-mix(in srgb,var(--side-on) 55%,transparent)}.gh .c{font-weight:400;font-size:12px;color:var(--side-muted)}
.rail a.sub{padding-left:28px;font-size:14px;min-height:34px}
.pdfb{margin-top:auto;justify-content:center}.railtot{margin-top:6px}
.srcs{font-size:12.5px;color:var(--muted)}
details.notes{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-s);padding:8px 14px;font-size:13.5px}
details.notes summary{cursor:pointer;font-weight:600;min-height:28px}details.notes ul{margin:6px 0 2px;padding-left:18px;display:grid;gap:4px}
.pfilter{gap:12px}.ptable td{vertical-align:middle}.ptable tr.cur td{background:var(--accent-soft)}
.plink{cursor:pointer;color:var(--ink)}.plink:hover b{color:var(--accent)}
.acts{white-space:nowrap}.btn.sm{min-height:34px;padding:4px 10px;font-size:13px;margin-left:4px}
.st{font-size:12.5px;border-radius:999px;padding:3px 10px;white-space:nowrap}.st-bhav{background:var(--surface2);color:var(--muted)}.st-chalu{background:var(--accent-soft);color:var(--accent)}.st-puru{background:#dcfce7;color:#166534}
:root[data-theme="dark"] .st-puru{background:#14361f;color:#86efac}
.pdfroot{position:fixed;left:-10000px;top:0}
.pg{width:794px;height:1123px;background:#fff;color:#111;padding:36px 40px;font-family:"Noto Sans Gujarati","Inter",sans-serif;font-size:12px;box-sizing:border-box;overflow:hidden;
  --ink:#111;--muted:#555;--surface:#fff;--surface2:#f1f3f6;--bg:#fff;--accent:#3730a3;--accent-soft:#e0e7ff;--line:#d6d9de}
.pg .ph{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px;font-size:11px;color:#444}

<script>
/* ===== Engine: Shilp Ratnakar rules. Internal unit = angul (1 angul = 0.75", 1 gaj = 24 angul = 18"); never displayed. ===== */
const ceil = x => Math.max(0, Math.ceil(x - 1e-6));
const IN = a => a * 0.75;
const ftin = i => `${Math.floor(i / 12)}′-${i % 12}″`;
const f1 = n => n.toLocaleString('en-IN', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const rs = n => '₹ ' + Math.round(n).toLocaleString('en-IN');
// value at g0 is v0; then +inc per gaj up to each breakpoint
function stepFrom(G, g0, v0, segs){ let v = v0, prev = g0; for (const [upto, inc] of segs){ if (G > prev) v += inc * (Math.min(G, upto) - prev); prev = upto; } return v; }
function interp(G, pts){ if (G <= pts[0][0]) return pts[0][1] * G / pts[0][0]; for (let i = 1; i < pts.length; i++){ const [g1, v1] = pts[i-1], [g2, v2] = pts[i]; if (G <= g2) return v1 + (v2 - v1) * (G - g1) / (g2 - g1); } return pts[pts.length-1][1]; }
const low = (G, f) => G < 1 ? f(1) * G : f(G);

  pith1:      G => low(G, g => stepFrom(g, 1, 12, [[5,5],[10,4],[20,3],[36,1.5],[50,.75]])),
  pith2:      G => G <= 5 ? interp(G, [[1,12],[2,16],[3,18],[4,27.5],[5,30]]) : stepFrom(G, 5, 30, [[10,4],[20,3],[36,2],[50,1]]),
  jagApa:     G => G <= 4 ? interp(G, [[1,24],[2,36],[3,48],[4,60]]) : stepFrom(G, 4, 60, [[12,12],[24,8],[50,6]]),
  jagMan:     G => low(G, g => stepFrom(g, 1, 12, [[12,12],[22,8],[32,6],[50,4.75]])),
  man1:       G => G <= 5 ? interp(G, [[1,38],[2,62],[3,79],[4,101],[5,123]]) : stepFrom(G, 5, 123, [[10,14],[30,12],[50,9]]),

  '57':  [['ખુરો',2],['કુંભો',7],['કલશ',3],['અંતરપત્રિકા',1],['કપોતાલી',3],['અંતરાલ',.5],['મંચિકા',3],['જંઘા',15],['ઉદ્ગમ',5],['ભરણી',3],['અંતરપત્રિકા',.5],['શિરાવટી',4],['કપોતાલી',3],['માલા',3],['છજ્જુ',4,4]],

const JATI = [['nagar','નાગર'],['latin','લતિન'],['sandhar','સાંધાર'],['bhumij','ભૂમિજ'],['dravid','દ્રાવિડ'],['vimana','વિમાન'],['mishrak','મિશ્રક'],['pushpak','પુષ્પક'],['valabhi','વલભી'],['phansana','ફાંસના']];
const DWAR_BY = {nagar:'n1',latin:'n1',sandhar:'n1',mishrak:'n1',pushpak:'n1',bhumij:'bh',dravid:'bh',vimana:'bh',valabhi:'bh',phansana:'dr'};
const PRASAD = ['કેશરી 8/5','સર્વતોભદ્ર 8/9','નંદન 10/13','નંદશાલિક 10/17','નંદીશ 10/21','મંદર 12/25','શ્રીવત્સ 14/29','અમૃતોદ્ભવ 14/33','હિમવાન્ 14/37','હેમકૂટ 14/41','કૈલાસ 16/45','પૃથ્વીજય 16/49','ઇન્દ્રનીલ 16/53','મહાનીલ 16/57','ભૂધર 16/61','રત્નકૂટ 18/65','વૈડૂર્ય 18/69','પદ્મરાગ 18/73','વજ્રક 18/77','મુકુટોજ્જ્વલ 18/81','ઐરાવત 18/85','રાજહંસ 22/89','ગરુડ 22/93','વૃષભ 22/97','મેરુ 22/101']
  .map(s => { const [n, t] = s.split(' '); const [tal, andak] = t.split('/'); return {n, tal, andak}; });

function tharRows(list, totalIn, keep){
  const sum = list.reduce((a, t) => a + t[1], 0), unit = totalIn / sum;
  const rows = list.map(([n, b, nk]) => ({n, b, h: Math.max(1, ceil(b * unit)), nik: ceil((nk || 0) * unit)}));
  if (keep){ const rest = rows.slice(0, -1).reduce((a, r) => a + r.h, 0); rows[rows.length-1].h = Math.max(1, ceil(totalIn) - rest); }
  return {rows, sum, unit, total: rows.reduce((a, r) => a + r.h, 0), book: ceil(totalIn)};
}

function compute(p){
  const k = p.ratio / (p.ratio - 2);
  const Px = p.gw * k, Pdx = p.gd * k, P = ceil(Px), Pd = ceil(Pdx), t = ceil(Px / p.ratio), G = Px / 18;
  const dep = p.wall === 'brick' ? p.face : t;
  const gradeK = p.grade === 'j' ? 1.2 : p.grade === 'k' ? 0.8 : 1;
  const ring = (nm, h, nik, w = P, d = Pd, dp = dep) => [[nm + ' · આગળ-પાછળ', ceil(w + 2*nik), ceil(dp + nik), h, 2], [nm + ' · બાજુ', Math.max(0, ceil(d - 2*dp)), ceil(dp + nik), h, 2]];
  const parts = [], W = [];
  if (G > 50) W.push('પ્રાસાદ 75′ થી મોટો છે — ગ્રંથ ના નિયમ 75′ સુધી ના જ છે.');

  // 1 paya
  { const ks = ceil(IN(R.kurmashila(G))), kt = ceil(IN(R.kurmashila(G)) / 3), ku = ceil(IN(R.kurma(G)) * (p.grade==='j'?1.25:p.grade==='k'?.75:1)), ds = ceil(IN(R.disha(G))), dt = ceil(IN(R.disha(G)) / 4);
    parts.push({key:'paya', name:'પાયો / ખાતમુહૂર્ત', src:'દ્વિતીય રત્ન · શ્લો. 97–124',
      kpis:[['કૂર્મશિલા', ks+'″', 'ચોરસ'],['દિશા શિલા', ds+'″', '8 નંગ, ચોરસ'],['કૂર્મ', ku+'″', 'સોના / ચાંદી નો']],
      meas:[['કૂર્મશિલા — પહોળાઈ (ચોરસ)', ks, 'શ્લો. 97–98'],['કૂર્મશિલા — જાડાઈ (પથ્થર)', kt, 'પહોળાઈ નો ⅓'],['કૂર્મશિલા નીચે પદ્મ', ceil(IN(R.kurmashila(G))/24), 'જાડાઈ નો ⅛'],['કૂર્મ (ઘન)', ku, 'શ્લો. 104–106'],['દિશા શિલા — પહોળાઈ (ચોરસ)', ds, 'શ્લો. 111–113'],['દિશા શિલા — જાડાઈ', dt, 'પહોળાઈ નો ¼']],
      stone:[['કૂર્મશિલા (ધરણી)', ks, ks, kt, 1],['દિશા શિલા', ds, ds, dt, 8]],
      warn:['ઈંટ ની કૂર્મશિલા ની જાડાઈ ગ્રંથ માં શંકાસ્પદ છે (⅙ કે ½) — ખાતરી કરવી.']}); }

  // 2 bhit
  { const names = ['મુક્તિક','પુષ્પક','ધર્મયશ'], hs = []; let h = IN(R.bhit1(G));
    for (let i = 0; i < p.m.bhit; i++){ hs.push(h); h *= .75; }
    const rows = hs.map((x, i) => ({n:`ભીત ${i+1} · ${names[i]}`, h: ceil(x), nik: ceil(hs.slice(i).reduce((a, y) => a + y/4, 0))}));
    parts.push({key:'bhit', name:'ભીત', src:'દ્વિતીય રત્ન · શ્લો. 149–157',
      kpis:[['ભીત', String(p.m.bhit), 'થર'],['કુલ ઊંચાઈ', rows.reduce((a,r)=>a+r.h,0)+'″', ftin(rows.reduce((a,r)=>a+r.h,0))],['પહેલી ભીત', rows[0].h+'″', 'સૌથી નીચે']],
      thar:{rows: rows.map(r => ({...r, b:'—'})), total: rows.reduce((a,r)=>a+r.h,0), book: null, sumLabel:''},
      stone: rows.flatMap(r => ring(r.n, r.h, r.nik)),
      chips:[{l:'ભીત ની સંખ્યા', path:'bhit', opts:[[1,'1'],[2,'2'],[3,'3']]}],
      warn:['ઉપર ની દરેક ભીત ¼ નાની અને પોતાની ઊંચાઈ ના ¼ જેટલી બહાર ગણી છે.']}); }

  // 3 pith
  let pithTotal = 0;
  { const base = IN((p.m.pith === 1 ? R.pith1 : R.pith2)(G)) * gradeK;
    const T = tharRows(PITH[p.m.pithType], base, p.m.keep); pithTotal = T.total;
    parts.push({key:'pith', name:'પીઠ', src: p.m.pith === 1 ? 'દ્વિતીય રત્ન · શ્લો. 158–160, 166–172' : 'દ્વિતીય રત્ન · શ્લો. 161–162, 166–172',

      thar:T, stone: T.rows.flatMap(r => ring(r.n, r.h, r.nik)),
      chips:[{l:'ઊંચાઈ', path:'pith', opts:[[1,'પદ્ધતિ 1'],[2,'પદ્ધતિ 2']]},{l:'પીઠ', path:'pithType', opts:[['maha','મહાપીઠ 53'],['kamad','કામદ 23'],['karna','કર્ણ 16']]}],

      warn:['ગ્રંથ ના પૃ. 65–68 (જગતી) નથી. જગતી ની લંબાઈ-પહોળાઈ તમે નાખો ત્યારે પથ્થર ગણાશે; પથ્થર ' + p.face + '″ ની ફેસિંગ તરીકે ગણ્યો છે.']}); }

  // 5 mandovar
  let kumbhoH = 0;
  { const base = IN(R['man' + p.m.man](G)); const T = tharRows(SETS[p.m.manSet], base, p.m.keep);
    kumbhoH = (T.rows.find(r => r.n === 'કુંભો') || {h:0}).h;
    const srcH = {1:'શ્લો. 3–4', 2:'શ્લો. 5–6', 3:'શ્લો. 7–15', 4:'શ્લો. 16–17'}[p.m.man];
    const w = []; if (p.m.man === 3 && G > 35 && G < 40) w.push('રીત 3 માં 52′-6″ થી 60′ વચ્ચે ગ્રંથ માં કૂદ છે (છાપ્યા મુજબ).');
    parts.push({key:'mandovar', name:'મંડોવર', src:'તૃતીય રત્ન · ' + srcH + ', 24–91',
      kpis:[['કુલ ઊંચાઈ', T.total+'″', ftin(T.total)],['થર', String(T.rows.length), T.sum+' ભાગ'],['ઘેરાવો', f1(2*(P+Pd)/12), 'રનિંગ ફૂટ']],
      thar:T, stone: T.rows.flatMap(r => ring(r.n, r.h, r.nik)),
      chips:[{l:'ઊંચાઈ', path:'man', opts:[[1,'રીત 1'],[2,'રીત 2'],[3,'રીત 3'],[4,'રીત 4']]},{l:'થર', path:'manSet', opts:[['144','144 ભાગ'],['108','108'],['27','27'],['57','ચતુર્મુખ 57']]}],
      warn:w}); }

  // 6 deewal / garbhagruh
  { const w = []; if (G > 10) w.push('પ્રાસાદ 15′ થી મોટો છે — ગ્રંથ મુજબ ભ્રમ (પ્રદક્ષિણા) સાથે કરવો (શ્લો. 110).');

function elev(T){
  const H = 470, top = 16, x = 62, w = 130; let y = top + H, o = '';
  T.rows.forEach((r, i) => { const h = r.h / T.total * H; y -= h; const nk = Math.min(r.nik * 1.4, 26), big = r.n.startsWith('જંઘા');
    o += `<rect x="${x - nk}" y="${y}" width="${w + 2*nk}" height="${h}" fill="${big ? 'var(--accent-soft)' : i % 2 ? 'var(--surface2)' : 'var(--surface)'}" stroke="var(--ink)" stroke-width=".8"/>`;
    if (h > 12) o += `<text x="${x + w + 32}" y="${y + h/2 + 4}" font-size="10.5" fill="var(--ink)">${r.n}</text><text x="${x - 30}" y="${y + h/2 + 4}" font-size="10.5" text-anchor="end" fill="var(--muted)" font-family="Inter,sans-serif">${r.h}″</text>`; });
  o += `<line x1="12" y1="${top}" x2="12" y2="${top + H}" stroke="var(--accent)" stroke-width="1.4"/>`;
  return `<svg viewBox="0 0 340 500" role="img" aria-label="થર નું ચિત્ર">${o}</svg>`;
}

const fmtDim = i => ftin(ceil(i));
function planInfo(p, c){
  const pr = p.prasad[0] === 'k' ? PRASAD[+p.prasad.slice(1)] : null;
  const kesh = pr && +pr.tal === 8;
  // segments along one side: [name, bhag, projection bhag]
  const segs = kesh ? [['કર્ણ',2,0],['ભદ્ર',4,1],['કર્ણ',2,0]] : [['કર્ણ',2,0],['પઢરો',1.5,.25],['ભદ્ર',3,.75],['પઢરો',1.5,.25],['કર્ણ',2,0]];
  const tot = kesh ? 8 : 10;
  return {segs, tot, label: kesh ? 'કેશરી · તલ 8 ભાગ' : 'તલ 10 ભાગ (રેખા 2 · પઢરો 1½ · ભદ્ર 3)'};
}
function sideOffsets(len, info){ const b = len / info.tot; let x = -len/2; return info.segs.map(([n, w, pj]) => { const a = x; x += w*b; return {n, a, z: x, pj: pj*b, w: w*b}; }); }

function elevSVG(p, c, sel){
  const P = c.P, pt = k => c.parts.find(x => x.key === k);
  const J = pt('jagati').thar, B = pt('bhit').thar, PI = pt('pith').thar, M = pt('mandovar').thar;
  const info = planInfo(p, c), segs = sideOffsets(P, info);
  const gK = p.grade === 'j' ? 1.25 : p.grade === 'k' ? 1.5 : 4/3;
  const Bw = P, Sh = Bw * gK, Sk = 0.6 * Bw, Aw = 0.62 * Bw, Ah = Aw / 2, Kw = P / 8, Kh = Kw * 1.5, Dl = P * (p.grade === 'j' ? 1 : p.grade === 'k' ? .8 : .9);
  const jagH = J.total, bH = B.total, pH = PI.total, mH = M.total;
  const top = jagH + bH + pH + mH + Sh + Ah + Kh;
  const pithCum = []; { let cum = 0; for (let i = PI.rows.length - 1; i >= 0; i--){ cum += PI.rows[i].nik; pithCum[i] = cum; } }
  const pithBase = P + 2 * (pithCum[0] || 0);
  const MP = pt('mandap'), mandW = +(MP.meas[0][1]), koli = ceil(P*.12), ST = pt('stambh');
  let jl0 = -(pithBase/2 + P*.3), jr0 = P/2 + koli + mandW + P*.3;
  if (p.jl > 0){ const mid0 = (jl0 + jr0)/2; jl0 = mid0 - p.jl/2; jr0 = mid0 + p.jl/2; }

  // sopan (steps) in front
  const sw0 = mand * .42;
  o += `<g>${Array.from({length: 7}, (_, i) => `<line x1="${-sw0/2}" y1="${jy1 + i*sopL/7}" x2="${sw0/2}" y2="${jy1 + i*sopL/7}" stroke="var(--ink)" stroke-width="${sw*.7}"/>`).join('')}<rect x="${-sw0/2}" y="${jy1}" width="${sw0}" height="${sopL}" fill="none" stroke="var(--ink)" stroke-width="${sw}"/></g>`;
  // prasad outline: segments on back, left, right; front is open to koli
  const pts = [];
  sx.forEach(sg => pts.push([sg.a, -D/2 - sg.pj], [sg.z, -D/2 - sg.pj]));
  sy.forEach(sg => pts.push([P/2 + sg.pj, sg.a], [P/2 + sg.pj, sg.z]));
  sx.slice().reverse().forEach(sg => pts.push([sg.z, D/2 + sg.pj], [sg.a, D/2 + sg.pj]));
  sy.slice().reverse().forEach(sg => pts.push([-P/2 - sg.pj, sg.z], [-P/2 - sg.pj, sg.a]));
  // chamfer the four rekha corners (45°, like the CAD)
  const ch = sx[0].w * .35, out = [];
  pts.forEach(([x, y]) => { const corner = Math.abs(Math.abs(x) - P/2) < .01 && Math.abs(Math.abs(y) - D/2) < .01;
    if (corner && !out.some(q => q[2] && q[0] === x && q[1] === y)){ const sxn = Math.sign(x), syn = Math.sign(y);
      // order matters: entering along one edge, leaving along the other
      const prev = out[out.length - 1]; const alongX = prev && Math.abs(prev[1] - y) < .01;
      if (alongX){ out.push([x - sxn*ch, y, 1], [x, y - syn*ch, 1]); } else { out.push([x, y - syn*ch, 1], [x - sxn*ch, y, 1]); }
    } else if (!corner) out.push([x, y, 0]); });
  const dedup = out.filter((q, i) => i === 0 || Math.abs(q[0] - out[i-1][0]) > .01 || Math.abs(q[1] - out[i-1][1]) > .01);
  const on = hl('deewal');
  o += `<g data-part="deewal" class="hit"><path d="M${dedup.map(q => q[0] + ' ' + q[1]).join(' L ')} Z M${-gw/2} ${-gd/2} L ${gw/2} ${-gd/2} L ${gw/2} ${gd/2} L ${-gw/2} ${gd/2} Z" fill-rule="evenodd" fill="${on ? 'var(--accent-soft)' : 'var(--surface2)'}" stroke="${stk('deewal')}" stroke-width="${sw*1.6}"/>
    ${sx.slice(1).map(sg => `<line x1="${sg.a}" y1="${-D/2 - sg.pj}" x2="${sg.a}" y2="${-D/2 - sg.pj + t*.35}" stroke="var(--ink)" stroke-width="${sw*.7}"/>`).join('')}</g>`;
  // garbhagruh niche on back wall (bhadra gokhlo)
  o += `<path d="M${-bh.w*.25} ${-gd/2} L ${-bh.w*.25} ${-gd/2 - t*.25} L ${bh.w*.25} ${-gd/2 - t*.25} L ${bh.w*.25} ${-gd/2}" fill="var(--bg)" stroke="var(--ink)" stroke-width="${sw}"/>`;
  // door opening + koli (antarala) with pilasters
  o += `<g data-part="dwar" class="hit"><rect x="${-doorW/2}" y="${gd/2 - sw}" width="${doorW}" height="${yK0 - gd/2 + sw*2}" fill="var(--bg)"/>
    <line x1="${-doorW/2}" y1="${gd/2}" x2="${-doorW/2}" y2="${yK0}" stroke="${stk('dwar')}" stroke-width="${sw*1.4}"/><line x1="${doorW/2}" y1="${gd/2}" x2="${doorW/2}" y2="${yK0}" stroke="${stk('dwar')}" stroke-width="${sw*1.4}"/></g>`;
  o += `<path d="M${-koliW/2} ${yK0} L ${-koliW/2} ${yM0} M${koliW/2} ${yK0} L ${koliW/2} ${yM0}" stroke="var(--ink)" stroke-width="${sw*1.4}"/>`;
  [[-koliW/2, yK0 + swp*.6],[koliW/2, yK0 + swp*.6],[-koliW/2, yM0 - swp*.6],[koliW/2, yM0 - swp*.6]].forEach(([x, y]) => o += `<rect x="${x - swp*.35}" y="${y - swp*.35}" width="${swp*.7}" height="${swp*.7}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw}"/>`);
  // mandap: open, 12 stambh on perimeter, octagon lines (ghummat), centre cross
  const mx = i => -mand/2 + swp/2 + (mand - swp) * i/3, my = j => yM0 + swp/2 + (mand - swp) * j/3;
  o += `<rect x="${-mand/2}" y="${yM0}" width="${mand}" height="${mand}" fill="${hl('mandap') ? 'var(--accent-soft)' : 'none'}" stroke="${stk('mandap')}" stroke-width="${sw}" data-part="mandap" class="hit"/>`;
  const oct = [[1,0],[2,0],[3,1],[3,2],[2,3],[1,3],[0,2],[0,1]];
  o += `<path d="M${oct.map(([i, j]) => mx(i) + ' ' + my(j)).join(' L ')} Z" fill="none" stroke="${hl('ghummat') ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${sw*(hl('ghummat') ? 2 : 1)}" data-part="ghummat" class="hit"/>`;
  o += `<line x1="${mx(0)}" y1="${(my(1)+my(2))/2}" x2="${mx(3)}" y2="${(my(1)+my(2))/2}" stroke="var(--muted)" stroke-width="${sw*.6}"/><line x1="${(mx(1)+mx(2))/2}" y1="${my(0)}" x2="${(mx(1)+mx(2))/2}" y2="${my(3)}" stroke="var(--muted)" stroke-width="${sw*.6}"/>`;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if (i === 0 || i === 3 || j === 0 || j === 3){
    const x = mx(i), y = my(j), s = swp;
    o += `<g data-part="stambh" class="hit"><rect x="${x - s*.6}" y="${y - s*.6}" width="${s*1.2}" height="${s*1.2}" fill="${hl('stambh') ? 'var(--accent-soft)' : 'var(--surface)'}" stroke="${stk('stambh')}" stroke-width="${sw}"/><rect x="${x - s*.45}" y="${y - s*.45}" width="${s*.9}" height="${s*.9}" fill="none" stroke="var(--ink)" stroke-width="${sw*.6}"/><rect x="${x - s*.3}" y="${y - s*.3}" width="${s*.6}" height="${s*.6}" fill="none" stroke="var(--ink)" stroke-width="${sw*.6}"/></g>`; }
  // labels
  o += `<text x="0" y="${-fs*.3}" font-size="${fs*1.05}" text-anchor="middle" fill="var(--ink)" font-weight="600">ગર્ભગૃહ</text><text x="0" y="${fs*1}" font-size="${fs*.9}" text-anchor="middle" fill="var(--muted)" font-family="Inter,sans-serif">${fmtDim(gw)} × ${fmtDim(gd)}</text>`;
  o += `<text x="0" y="${(yM0 + yM1)/2 + fs*.35}" font-size="${fs}" text-anchor="middle" fill="var(--muted)">મંડપ</text>`;
  // dimensions (CAD style): ink = structure, accent = overall
  const dim = (x1, y1, x2, y2, label, col = 'var(--ink)', off = 0, vert = false) => {
    const tx = (x1 + x2)/2, ty = (y1 + y2)/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}"/>
      ${vert ? `<line x1="${x1 - fs*.3}" y1="${y1}" x2="${x1 + fs*.3}" y2="${y1}" stroke="${col}" stroke-width="${sw}"/><line x1="${x2 - fs*.3}" y1="${y2}" x2="${x2 + fs*.3}" y2="${y2}" stroke="${col}" stroke-width="${sw}"/>
        <text x="${tx - fs*.45 - off}" y="${ty}" font-size="${fs*.8}" fill="${col}" text-anchor="middle" font-family="Inter,sans-serif" transform="rotate(-90 ${tx - fs*.45 - off} ${ty})">${label}</text>`
      : `<line x1="${x1}" y1="${y1 - fs*.3}" x2="${x1}" y2="${y1 + fs*.3}" stroke="${col}" stroke-width="${sw}"/><line x1="${x2}" y1="${y2 - fs*.3}" x2="${x2}" y2="${y2 + fs*.3}" stroke="${col}" stroke-width="${sw}"/>
        <text x="${tx}" y="${ty - fs*.35}" font-size="${fs*.8}" fill="${col}" text-anchor="middle" font-family="Inter,sans-serif">${label}</text>`}`; };
  // back side segments of prasad (left of the plan in the CAD; here on top)
  const yb = -D/2 - bh.pj - fs*1.6;
  sx.forEach(sg => o += dim(sg.a, yb, sg.z, yb, fmtDim(sg.w)));
  o += dim(-P/2, yb - fs*1.5, P/2, yb - fs*1.5, fmtDim(P) + ' (કર્ણ થી કર્ણ)');
  // garbhagruh inner width, wall
  o += dim(-gw/2, -gd/2 + fs*1.4, gw/2, -gd/2 + fs*1.4, fmtDim(gw), 'var(--muted)');
  o += dim(gw/2, -gd/4, P/2, -gd/4, t + '″', 'var(--muted)');
  // right side: prasad depth, koli, mandap
  const xr = jx + fs*1.2;
  o += dim(xr, -D/2, xr, D/2, fmtDim(D), 'var(--ink)', 0, true) + dim(xr, yK0, xr, yM0, fmtDim(koliL), 'var(--ink)', 0, true) + dim(xr, yM0, xr, yM1, fmtDim(mand), 'var(--ink)', 0, true);
  // overall jagati
  const xr2 = xr + fs*2.2;
  o += dim(xr2, jy0, xr2, jy1, fmtDim(jy1 - jy0) + ' જગતી', 'var(--accent)', 0, true);
  o += dim(-jx, jy1 + sopL + fs*1.6, jx, jy1 + sopL + fs*1.6, fmtDim(2*jx) + ' જગતી', 'var(--accent)');
  o += dim(-mand/2, yM1 - fs*1.2, mand/2, yM1 - fs*1.2, fmtDim(mand), 'var(--muted)');
  const minX = -jx - fs*2, minY = yb - fs*3.2, W = 2*jx + fs*8, H = (jy1 + sopL + fs*3) - minY;
  return `<svg class="dw" viewBox="${minX} ${minY} ${W} ${H}" role="img" aria-label="પ્લાન">${o}</svg>`;
}

/* ===================== Drawing of every item in a part ===================== */
function profileSVG(rows, o = {}){
  // rows bottom -> top: {n, h, w}; draws a centred elevation with each item's height and width dimensioned
  const H = rows.reduce((a, r) => a + r.h, 0), W = Math.max(...rows.map(r => r.w));
  const fs = Math.max(H, W*.55) / 24, sw = fs / 10, lw = fs * 9.5;
  const X = lw + fs*3.4 + W/2, Y = v => H + fs*1.2 - v;
  let s = '', y = 0;
  rows.forEach((r, i) => {
    const x = X - r.w/2, top = Y(y + r.h);
    if (r.shape === 'round') s += `<rect x="${x}" y="${top}" width="${r.w}" height="${r.h}" rx="${Math.min(r.h, r.w)/2}" fill="${i % 2 ? 'var(--surface2)' : 'var(--surface)'}" stroke="var(--ink)" stroke-width="${sw}"/>`;
    else if (r.shape === 'slope') s += `<polygon points="${X - r.w*.35},${top} ${X + r.w*.35},${top} ${X + r.w/2},${Y(y + r.h*.25)} ${X + r.w/2},${Y(y)} ${x},${Y(y)} ${x},${Y(y + r.h*.25)}" fill="var(--surface2)" stroke="var(--ink)" stroke-width="${sw}"/>`;
    else s += `<rect x="${x}" y="${top}" width="${r.w}" height="${r.h}" fill="${r.hl ? 'var(--accent-soft)' : i % 2 ? 'var(--surface2)' : 'var(--surface)'}" stroke="var(--ink)" stroke-width="${sw}"/>`;
    if (r.deco === 'tri'){ const n = Math.max(2, Math.round(r.w / (r.h*1.1))), ww = r.w / n; for (let q = 0; q < n; q++){ const cx = x + ww*(q + .5); s += `<polygon points="${cx - ww*.3},${Y(y + r.h*.12)} ${cx + ww*.3},${Y(y + r.h*.12)} ${cx},${Y(y + r.h*.85)}" fill="none" stroke="var(--muted)" stroke-width="${sw*.8}"/>`; } }
    if (r.deco === 'niche'){ [-.3, 0, .3].forEach(f => { const nw = Math.min(r.w*.14, r.h*.42), cx = X + r.w*f, b = y + r.h*.1, h = r.h*.62;
      s += `<rect x="${cx - nw/2}" y="${Y(b + h)}" width="${nw}" height="${h}" fill="var(--bg)" stroke="var(--ink)" stroke-width="${sw*.8}"/><polygon points="${cx - nw*.62},${Y(b + h)} ${cx + nw*.62},${Y(b + h)} ${cx},${Y(b + h + r.h*.22)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${sw*.8}"/>`; }); }
    // left: height dim per item
    const dx = X - W/2 - fs*1.4;
    s += `<line x1="${dx}" y1="${Y(y)}" x2="${dx}" y2="${top}" stroke="var(--accent)" stroke-width="${sw}"/><line x1="${dx - fs*.25}" y1="${top}" x2="${dx + fs*.25}" y2="${top}" stroke="var(--accent)" stroke-width="${sw}"/>
      <text x="${dx - fs*.35}" y="${(Y(y) + top)/2 + fs*.32}" font-size="${fs*.85}" text-anchor="end" fill="var(--accent)" font-family="Inter,sans-serif">${r.h}″</text>`;
    // right: name + width
    s += `<line x1="${X + r.w/2}" y1="${(Y(y) + top)/2}" x2="${X + W/2 + fs*.8}" y2="${(Y(y) + top)/2}" stroke="var(--line)" stroke-width="${sw*.7}"/>
      <text x="${X + W/2 + fs*1}" y="${(Y(y) + top)/2 + fs*.32}" font-size="${fs*.85}" fill="var(--ink)">${r.n}${o.widths === false ? '' : ` <tspan fill="var(--muted)" font-family="Inter,sans-serif">· ${r.w}″</tspan>`}</text>`;
    y += r.h; });
  // total height + base width
  const tx = X - W/2 - fs*4.6;
  s += `<line x1="${tx}" y1="${Y(0)}" x2="${tx}" y2="${Y(H)}" stroke="var(--ink)" stroke-width="${sw*1.2}"/><line x1="${tx - fs*.3}" y1="${Y(H)}" x2="${tx + fs*.3}" y2="${Y(H)}" stroke="var(--ink)" stroke-width="${sw}"/><line x1="${tx - fs*.3}" y1="${Y(0)}" x2="${tx + fs*.3}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="${sw}"/>
    <text x="${tx - fs*.45}" y="${Y(H/2)}" font-size="${fs}" fill="var(--ink)" font-weight="600" text-anchor="middle" font-family="Inter,sans-serif" transform="rotate(-90 ${tx - fs*.45} ${Y(H/2)})">${H}″ · ${ftin(H)}</text>`;
  if (o.base){ const by = Y(0) + fs*1.3; s += `<line x1="${X - o.base/2}" y1="${by}" x2="${X + o.base/2}" y2="${by}" stroke="var(--ink)" stroke-width="${sw}"/><text x="${X}" y="${by + fs*1.2}" font-size="${fs*.85}" text-anchor="middle" fill="var(--ink)" font-family="Inter,sans-serif">${o.baseLabel || ''}${o.base}″ · ${ftin(o.base)}</text>`; }
  if (o.extra) s += o.extra(X, Y, fs, sw);
  const vbW = X + W/2 + fs*14, vbH = H + fs*(o.base ? 5 : 2.6);
  return `<svg class="dw pd2" viewBox="${tx - fs*1.6} 0 ${vbW - tx + fs*1.6} ${vbH}" role="img" aria-label="ચિત્ર">${s}</svg>`;
}

function dwarSVG(p, c){
  const d = c.parts.find(x => x.key === 'dwar'), h = +d.kpis[0][1].replace('″',''), w = +d.kpis[1][1].replace('″',''), n = +d.kpis[2][1], sw0 = +d.meas[3][1], um = +d.meas[4][1];
  const ot = Math.max(6, ceil(sw0*.8)), W = w + 2*sw0, H = um + h + ot, fs = Math.max(H, W) / 24, s1 = fs/10;
  const X = fs*6 + W/2, Y = v => H + fs*1.5 - v;
  let s = `<rect x="${X - W/2}" y="${Y(um)}" width="${W}" height="${um}" fill="var(--surface2)" stroke="var(--ink)" stroke-width="${s1}"/>`;
  s += `<path d="M${X - w/2} ${Y(0)} A ${w/2} ${um*.9} 0 0 1 ${X + w/2} ${Y(0)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${s1}"/>`;
  for (const side of [-1, 1]) for (let k = 0; k < n; k++){ const bw = sw0 / n, x = side < 0 ? X - w/2 - sw0 + k*bw : X + w/2 + k*bw;
    s += `<rect x="${x}" y="${Y(um + h)}" width="${bw}" height="${h}" fill="${k % 2 ? 'var(--surface2)' : 'var(--surface)'}" stroke="var(--ink)" stroke-width="${s1*.7}"/>`; }
  s += `<rect x="${X - w/2}" y="${Y(um + h)}" width="${w}" height="${h}" fill="var(--bg)" stroke="var(--ink)" stroke-width="${s1*1.4}"/>`;
  s += `<rect x="${X - W/2}" y="${Y(um + h + ot)}" width="${W}" height="${ot}" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="${s1}"/>`;
  s += `<text x="${X}" y="${Y(um + h + ot/2) + fs*.3}" font-size="${fs*.8}" text-anchor="middle" fill="var(--ink)">ઓતરંગ</text><text x="${X}" y="${Y(um/2) + fs*.3}" font-size="${fs*.8}" text-anchor="middle" fill="var(--ink)">ઉંબર</text><text x="${X}" y="${Y(um + h/2)}" font-size="${fs*.9}" text-anchor="middle" fill="var(--muted)">દ્વાર</text>`;
  const dm = (x1, y1, x2, y2, t, vert) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-width="${s1}"/>` + (vert
    ? `<text x="${x1 - fs*.4}" y="${(y1 + y2)/2}" font-size="${fs*.85}" fill="var(--accent)" text-anchor="middle" font-family="Inter,sans-serif" transform="rotate(-90 ${x1 - fs*.4} ${(y1 + y2)/2})">${t}</text>`
    : `<text x="${(x1 + x2)/2}" y="${y1 - fs*.35}" font-size="${fs*.85}" fill="var(--accent)" text-anchor="middle" font-family="Inter,sans-serif">${t}</text>`);
  s += dm(X - W/2 - fs*1.5, Y(um), X - W/2 - fs*1.5, Y(um + h), h + '″ ઊંચાઈ', 1) + dm(X - W/2 - fs*1.5, Y(0), X - W/2 - fs*1.5, Y(um), um + '″', 1) + dm(X - W/2 - fs*1.5, Y(um + h), X - W/2 - fs*1.5, Y(um + h + ot), ot + '″', 1);
  s += dm(X - w/2, Y(um + h*.55), X + w/2, Y(um + h*.55), w + '″ પહોળાઈ') + dm(X + w/2, Y(um + h + ot) - fs*.6, X + w/2 + sw0, Y(um + h + ot) - fs*.6, sw0 + '″ શાખા');
  s += `<text x="${X}" y="${Y(0) + fs*1.6}" font-size="${fs*.85}" text-anchor="middle" fill="var(--muted)">${n} શાખા · શંખાવટ ${w}″ × ${ceil(w/2)}″</text>`;
  return `<svg class="dw pd2" viewBox="0 0 ${W + fs*12} ${H + fs*4}" role="img" aria-label="દ્વાર">${s}</svg>`;
}

function dhwajSVG(p, c){
  const d = c.parts.find(x => x.key === 'dhwaj'), L = +d.meas[0][1], th = +d.meas[1][1], mk = +d.meas[2][1], pw = +d.meas[6][1];
  const fs = L / 22, s1 = fs/10, X = fs*7, Y = v => L + fs*2 - v;
  let s = `<rect x="${X - th/2}" y="${Y(L)}" width="${th}" height="${L}" fill="var(--surface2)" stroke="var(--ink)" stroke-width="${s1}"/>`;
  for (let k = 1; k < 9; k++) s += `<line x1="${X - th/2}" y1="${Y(L*k/9)}" x2="${X + th/2}" y2="${Y(L*k/9)}" stroke="var(--muted)" stroke-width="${s1*.7}"/>`;
  s += `<rect x="${X - mk/2}" y="${Y(L*.92)}" width="${mk}" height="${ceil(mk/6)}" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="${s1}"/>`;
  s += `<path d="M${X + th/2} ${Y(L*.9)} q ${L*.3} ${pw*.2} ${L*.55} ${pw*1.2} l -${L*.1} ${pw*.5} q -${L*.25} -${pw*.6} -${L*.45} -${pw*.5} Z" fill="var(--accent)" opacity=".85"/>`;
  s += `<line x1="${X - th/2 - fs*1.6}" y1="${Y(0)}" x2="${X - th/2 - fs*1.6}" y2="${Y(L)}" stroke="var(--accent)" stroke-width="${s1}"/><text x="${X - th/2 - fs*2}" y="${Y(L/2)}" font-size="${fs*.9}" fill="var(--accent)" text-anchor="middle" font-family="Inter,sans-serif" transform="rotate(-90 ${X - th/2 - fs*2} ${Y(L/2)})">${L}″ · ${ftin(L)}</text>`;
  s += `<text x="${X + mk/2 + fs*.6}" y="${Y(L*.92) + fs*.3}" font-size="${fs*.8}" fill="var(--ink)">મર્કટી ${mk}″</text><text x="${X + th/2 + fs*.6}" y="${Y(L*.3)}" font-size="${fs*.8}" fill="var(--ink)">દંડ ${th}″ જાડો</text><text x="${X + L*.3}" y="${Y(L*.9) + pw*1.6}" font-size="${fs*.8}" fill="var(--ink)">પતાકા ${pw}″</text>`;
  return `<svg class="dw pd2" viewBox="0 0 ${L*.75 + fs*8} ${L + fs*4}" role="img" aria-label="ધ્વજદંડ">${s}</svg>`;
}

function partDrawing(p, c, pt){
  const P = c.P, k = pt.key;
  if (k === 'deewal' || k === 'mandap') return planSVG(p, c, k);
  if (k === 'shikhar') return elevSVG(p, c, 'shikhar');
  if (k === 'dwar') return dwarSVG(p, c);
  if (k === 'dhwaj') return dhwajSVG(p, c);
  const T = pt.thar; if (!T) return elevSVG(p, c, k);
  if (k === 'stambh'){ const sw = +pt.kpis[0][1].replace('″',''), ws = [1.25, 1, 1.15, 1.3, 0];
    const rows = T.rows.map((r, i) => ({n: r.n, h: r.h, w: i === 4 ? ceil(sw*3.2) : ceil(sw*ws[i])}));
    return profileSVG(rows, {base: sw, baseLabel: 'સ્તંભ '}); }
  if (k === 'ghummat'){ const D = ceil(+pt.stone[0][1] / Math.PI);
    return profileSVG(T.rows.map((r, i) => ({n: r.n, h: r.h, w: ceil(D*(1 - i/(T.rows.length + 1))), shape:'round'})), {base: D, baseLabel: 'વ્યાસ '}); }
  if (k === 'amalsaro'){ const ws = pt.stone.map(r => r[1]); const kal = pt.stone[4];
    return profileSVG([...T.rows.map((r, i) => ({n: r.n, h: r.h, w: ws[i], shape: i === 1 ? 'round' : ''})), {n:'કલશ', h: kal[3], w: kal[1], shape:'round'}], {base: ws[1], baseLabel: 'આમલસારો '}); }
  const base = k === 'jagati' ? (p.jl > 0 ? p.jl : ceil(P*2.4)) : P;
  const cum = []; if (k === 'pith' || k === 'jagati'){ let a = 0; for (let i = T.rows.length - 1; i >= 0; i--){ a += T.rows[i].nik; cum[i] = a; } }
  const rows = T.rows.map((r, i) => ({n: r.n, h: r.h, w: ceil(base + 2*((k === 'pith' || k === 'jagati') ? cum[i] : r.nik)),
    shape: k === 'mandovar' && i === T.rows.length - 1 ? 'slope' : '', deco: r.n.startsWith('કુંભો') ? 'tri' : r.n.startsWith('જંઘા') ? 'niche' : '', hl: r.n.startsWith('જંઘા')}));
  return profileSVG(rows, {base, baseLabel: k === 'jagati' ? 'જગતી ' : 'પ્રાસાદ '});
}

const drawCard = (title, svg, src) => `<div class="card dcard"><div class="hd"><h2>${title}</h2><span class="sp"></span>${src ? `<span class="src">${src}</span>` : ''}</div><div class="dbody">${svg}</div></div>`;

function vHome(p, c){
  const key = x => x.kpis[0];
  const fi = (id, v, u) => `<div class="box"><input id="${id}" class="num" inputmode="numeric" value="${v}" data-in="${id}"><em>${u}</em></div>`;
  return `<div class="hero"><div class="hl"><small>${esc(p.name)}</small><button type="button" class="btn thm" data-theme-set="${S.theme === 'dark' ? 'light' : 'dark'}">${S.theme === 'dark' ? '☀ લાઇટ' : '☾ ડાર્ક'}</button><h1 class="num">${rs(c.total * p.rate)}</h1><div class="hs num">${f1(c.total)} ઘન ફૂટ પથ્થર · ${rs(p.rate)} / CFT</div></div>
      <div class="hr num"><div><small>પ્રાસાદ</small><b>${ftin(c.P)}</b></div><div><small>દીવાલ</small><b>${c.t}″</b></div><div><small>મંડોવર</small><b>${ftin(c.mando)}</b></div></div></div>
    <div class="card"><div class="bd row"><span class="ql">ગર્ભગૃહ</span>${fi('gwf', Math.floor(p.gw/12), 'ફૂટ')}${fi('gwi', ceil(p.gw%12), 'ઇંચ')}<span style="color:var(--muted)">×</span>${fi('gdf', Math.floor(p.gd/12), 'ફૂટ')}${fi('gdi', ceil(p.gd%12), 'ઇંચ')}<button class="btn" data-nav="input">બધી માહિતી →</button></div></div>
    <div class="tiles">${c.parts.map(x => `<button class="tile" data-part="${x.key}"><span class="tn">${x.name}</span><span class="tk num">${key(x)[1]}</span><span class="ts">${key(x)[0]}</span><span class="tc num">${x.cft ? f1(x.cft) + ' CFT · ' + rs(x.cft * p.rate) : '—'}</span></button>`).join('')}</div>
    <div class="dpair">${drawCard('એલિવેશન', elevSVG(p, c, null))}${drawCard('પ્લાન', planSVG(p, c, null))}</div>`;
}
function vDraw(p, c){
  return `<div class="bar"><div><div class="crumb">${esc(p.name)}</div><h1>ચિત્ર</h1></div><span class="sp"></span><span class="crumb">ભાગ પર ક્લિક કરો</span></div>
    <div class="dpair big">${drawCard('એલિવેશન', elevSVG(p, c, S.part), 'શિલ્પ રત્નાકર મુજબ')}${drawCard('પ્લાન', planSVG(p, c, S.part), planInfo(p, c).label)}</div>`;
}
function render(){
  const p = cur(), c = compute(p);
  let v = S.view; if (!['home','input','draw','part','summary','projects'].includes(v)) v = S.view = 'home';
  document.body.dataset.style = 'a'; if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
  const nav = (id, t) => `<a class="${v === id ? 'on' : ''}" data-nav="${id}" tabindex="0">${t}</a>`;
  let main;
  if (v === 'home') main = vHome(p, c);
  else if (v === 'input') main = vInput(p, c);
  else if (v === 'draw') main = vDraw(p, c);
  else if (v === 'summary') main = vSummary(p, c);
  else if (v === 'projects') main = vProjects();
  else { main = vPart(p, c); const pt = c.parts.find(x => x.key === S.part) || c.parts[4];
    const dr = drawCard(pt.name + ' — ચિત્ર', partDrawing(p, c, pt));
    main = main.replace(/<div class="card elev">[\s\S]*?<\/svg><\/div>/, '<div class="pdraw">' + dr + '</div>');
    if (!pt.thar && S.tab === 'maap') main += `<div class="pdraw solo">${dr}</div>`; }
  document.getElementById('root').innerHTML = `<div class="app">
    <aside class="rail"><div class="brand"><div class="logo">${ic.temple}</div><div style="flex:1;min-width:0"><b>બૃહદ્ ટેમ્પલ એસ્ટીમેટ</b><small class="ell">${esc(p.name)}</small></div><button class="ibtn" data-theme-set="${S.theme === 'dark' ? 'light' : 'dark'}" aria-label="થીમ બદલો">${S.theme === 'dark' ? '☀' : '☾'}</button></div>
      ${nav('projects', '📁 પ્રોજેક્ટ')}${nav('home', '▦ ડેશબોર્ડ')}${nav('input', '✎ માહિતી')}${nav('draw', '⌂ ચિત્ર')}${nav('summary', '∑ સારાંશ')}
      <div class="lab">ભાગ</div>
      ${GROUPS.map(([g, ks]) => { const xs = ks.map(k => c.parts.find(x => x.key === k)).filter(Boolean), op = S.grp ? S.grp[g] !== true : true, has = xs.some(x => v === 'part' && S.part === x.key);
        return `<div class="grp ${op || has ? 'op' : ''}"><button class="gh" data-grp="${g}"><span>${op || has ? '▾' : '▸'} ${g}</span><span class="c num">${f1(xs.reduce((a, x) => a + x.cft, 0))}</span></button>
          ${op || has ? xs.map(x => `<a class="sub ${v === 'part' && S.part === x.key ? 'on' : ''}" data-part="${x.key}" tabindex="0">${x.name}</a>`).join('') : ''}</div>`; }).join('')}
      ${LATER.map(n => `<a class="off">${n}<span class="c">પછી</span></a>`).join('')}
      <button class="btn pdfb" data-act="pdfcur">⇩ PDF બનાવો</button><div class="railtot num"><small>${S.cloud ? '☁ સેવ · ' : ''}કુલ</small><b>${f1(c.total)} CFT</b><span>${rs(c.total * p.rate)}</span></div></aside>
    <main class="main"><div class="wrap">${main}</div></main></div>
    <nav class="bnav" aria-label="મુખ્ય">${[['home','ડેશબોર્ડ',ic.chart],['input','માહિતી',ic.edit],['draw','ચિત્ર',ic.temple.replace(/20/g,'22')],['projects','પ્રોજેક્ટ',ic.grid]].map(([id, t, i]) => `<button class="${v === id ? 'on' : ''}" data-nav="${id}">${i}${t}</button>`).join('')}</nav>`;
  save();
}
/* ===================== Projects, grouped sidebar, PDF, cloud save ===================== */
const STATUS = [['bhav','ભાવ આપ્યો'],['chalu','કામ ચાલુ'],['puru','પૂરું']];
const GROUPS = [['નીચે નો ભાગ',['bhit','pith','jagati']],['પ્રાસાદ',['mandovar','deewal','dwar']],['મંડપ',['mandap','stambh','ghummat']],['ઉપર નો ભાગ',['shikhar','amalsaro','dhwaj']]];
const todayStr = () => new Date().toISOString().slice(0, 10);
for (const pr of S.projects){ pr.client ??= ''; pr.place ??= ''; pr.status ??= 'bhav'; pr.date ??= todayStr(); }

function vProjects(){
  const q = (S.q || '').trim().toLowerCase(), f = S.fStatus || 'all';
  const list = S.projects.map((p, i) => ({p, i})).filter(({p}) => (f === 'all' || p.status === f) && (!q || [p.name, p.client, p.place].join(' ').toLowerCase().includes(q)));
  const tot = S.projects.reduce((a, p) => a + compute(p).total * p.rate, 0);
  return `<div class="bar"><div><div class="crumb">${S.projects.length} પ્રોજેક્ટ · કુલ ${rs(tot)}</div><h1>પ્રોજેક્ટ</h1></div><span class="sp"></span><button class="btn pri" data-act="new">+ નવો પ્રોજેક્ટ</button></div>
  <div class="row pfilter"><div class="box" style="flex:1 1 220px"><input id="q" placeholder="નામ, ગ્રાહક કે સ્થળ શોધો" value="${esc(S.q || '')}" data-q="1" style="font-family:var(--font)"></div>
    <div class="chips">${[['all','બધા'], ...STATUS].map(([v, t]) => `<button class="chip ${f === v ? 'on' : ''}" data-fstatus="${v}">${t}</button>`).join('')}</div></div>
  <div class="card"><div class="sx"><table class="ptable"><thead><tr><th>મંદિર</th><th>ગ્રાહક / સ્થળ</th><th>સ્થિતિ</th><th class="r">ગર્ભગૃહ</th><th class="r">પથ્થર</th><th class="r">અંદાજ</th><th></th></tr></thead><tbody>
    ${list.map(({p, i}) => { const c = compute(p); return `<tr class="${i === S.cur ? 'cur' : ''}"><td><a class="plink" data-open="${i}" tabindex="0"><b>${esc(p.name)}</b></a><span class="fi num">${p.date}</span></td>
      <td>${esc(p.client || '—')}<span class="fi">${esc(p.place || '')}</span></td>
      <td><span class="st st-${p.status}">${(STATUS.find(s => s[0] === p.status) || STATUS[0])[1]}</span></td>
      <td class="r num">${ftin(ceil(p.gw))} × ${ftin(ceil(p.gd))}</td><td class="r num">${f1(c.total)} CFT</td><td class="r num"><b>${rs(c.total * p.rate)}</b></td>
      <td class="r acts"><button class="btn sm" data-open="${i}">ખોલો</button><button class="btn sm" data-copy="${i}">કોપી</button><button class="btn sm" data-pdf="${i}">PDF</button>
        ${S.projects.length > 1 ? (S.confirmDel === i ? `<button class="btn sm dan" data-del="${i}">હા, કાઢો</button><button class="btn sm" data-nodel="1">ના</button>` : `<button class="btn sm dan" data-askdel="${i}">કાઢો</button>`) : ''}</td></tr>`; }).join('') || `<tr><td colspan="7" style="color:var(--muted)">કોઈ પ્રોજેક્ટ મળ્યો નથી.</td></tr>`}
  </tbody></table></div></div>${S.msg ? `<div class="warn">${S.msg}</div>` : ''}`;
}

// tidy part pages: book source as small line, notes folded
const _vPart = vPart;
vPart = function(p, c){
  let h = _vPart(p, c);
  const notes = []; h = h.replace(/<div class="warn"><span>⚠<\/span><div>([\s\S]*?)<\/div><\/div>/g, (m, t) => { notes.push(t); return ''; });
  h = h.replace(/<span class="sp"><\/span><span class="src">([^<]*)<\/span><\/div>\s*<div class="kpis">/, '<span class="sp"></span><span class="srcs">📖 $1</span></div><div class="kpis">');
  if (notes.length) h += `<details class="notes"><summary>⚠ નોંધ (${notes.length})</summary><ul>${notes.map(n => `<li>${n}</li>`).join('')}</ul></details>`;
  return h;
};
// extra project fields on the input screen
const _vInput = vInput;
vInput = function(p, c){
  const extra = `<div class="field"><label for="client">ગ્રાહક</label><div class="box"><input id="client" value="${esc(p.client)}" data-in="client" style="font-family:var(--font)"></div></div>
    <div class="field"><label for="place">સ્થળ</label><div class="box"><input id="place" value="${esc(p.place)}" data-in="place" style="font-family:var(--font)"></div></div>
    <div class="field"><label for="date">તારીખ</label><div class="box"><input id="date" type="date" value="${p.date}" data-in="date"></div></div>
    <div class="field"><div class="lb">સ્થિતિ</div>${seg('status', p.status, STATUS)}</div>`;
  return _vInput(p, c).replace('<div class="field full"><div class="lb">ગર્ભગૃહ', extra + '<div class="field full"><div class="lb">ગર્ભગૃહ');
};

/* ---- PDF report ---- */
async function makePdf(i){
  const p = S.projects[i], c = compute(p);
  S.msg = 'PDF બને છે…'; render();
  const box = document.createElement('div'); box.className = 'pdfroot'; document.body.appendChild(box);
  const pageHead = n => `<div class="ph"><b>બૃહદ્ ટેમ્પલ એસ્ટીમેટ</b><span>${esc(p.name)} · ${esc(p.client)} · ${esc(p.place)} · ${p.date}</span><span>પાનું ${n}</span></div>`;
  const pages = [];
  pages.push(`${pageHead(1)}<h1>${esc(p.name)}</h1>
    <table class="kv"><tr><td>ગ્રાહક</td><td>${esc(p.client || '—')}</td><td>સ્થળ</td><td>${esc(p.place || '—')}</td></tr>
      <tr><td>ગર્ભગૃહ</td><td class="num">${ftin(ceil(p.gw))} × ${ftin(ceil(p.gd))}</td><td>પ્રાસાદ</td><td class="num">${ftin(c.P)} (${c.P}″)</td></tr>
      <tr><td>દીવાલ</td><td class="num">${c.t}″ · ${p.wall === 'brick' ? 'ઈંટ + પથ્થર ' + p.face + '″' : 'પૂરો પથ્થર'}</td><td>જાતિ</td><td>${JATI.find(j => j[0] === p.jati)[1]}</td></tr>
      <tr><td>દર</td><td class="num">${rs(p.rate)} / CFT</td><td>તારીખ</td><td class="num">${p.date}</td></tr></table>
    <h2>સારાંશ</h2><table><thead><tr><th>ભાગ</th><th class="r">ઘન ફૂટ</th><th class="r">ખર્ચ</th></tr></thead><tbody>${c.parts.map(x => `<tr><td>${x.name}</td><td class="r num">${f1(x.cft)}</td><td class="r num">${rs(x.cft * p.rate)}</td></tr>`).join('')}
      <tr class="tot"><td>કુલ</td><td class="r num">${f1(c.total)}</td><td class="r num">${rs(c.total * p.rate)}</td></tr></tbody></table>`);
  pages.push(`${pageHead(2)}<h2>એલિવેશન</h2><div class="pd">${elevSVG(p, c, null)}</div><h2>પ્લાન</h2><div class="pd">${planSVG(p, c, null)}</div>`);
  let cur = '', rows = 0, n = 3;
  for (const x of c.parts){
    const meas = x.thar ? x.thar.rows.map(r => `<tr><td>${r.n}</td><td class="r num">${r.h}″</td><td class="r num">${ftin(r.h)}</td></tr>`).join('')
      : (x.meas || []).map(([l, v]) => `<tr><td>${l}</td><td class="r num">${typeof v === 'number' ? v + '″' : v}</td><td class="r num">${typeof v === 'number' ? ftin(v) : ''}</td></tr>`).join('');
    const stn = x.stone.map(r => `<tr><td>${r[0]}</td><td class="r num">${r[1]}</td><td class="r num">${r[2]}</td><td class="r num">${r[3]}</td><td class="r num">${r[4]}</td><td class="r num">${f1(r[1]*r[2]*r[3]*r[4]/1728)}</td></tr>`).join('');
    const block = `<h2>${x.name} <small>${x.src}</small></h2><div class="two"><table><thead><tr><th>માપ</th><th class="r">ઇંચ</th><th class="r">ફૂટ-ઇંચ</th></tr></thead><tbody>${meas}</tbody></table>
      ${stn ? `<table><thead><tr><th>પથ્થર</th><th class="r">L</th><th class="r">W</th><th class="r">H</th><th class="r">નંગ</th><th class="r">CFT</th></tr></thead><tbody>${stn}<tr class="tot"><td>કુલ</td><td></td><td></td><td></td><td></td><td class="r num">${f1(x.cft)}</td></tr></tbody></table>` : '<div></div>'}</div>`;
    const sz = Math.max(x.thar ? x.thar.rows.length : (x.meas || []).length, x.stone.length) + 4;
    if (rows + sz > 46 && cur){ pages.push(pageHead(n++) + cur); cur = ''; rows = 0; }
    cur += block; rows += sz;
  }
  if (cur) pages.push(pageHead(n++) + cur);
  try {
    const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:'pt', format:'a4'});
    for (let k = 0; k < pages.length; k++){
      box.innerHTML = `<div class="pg">${pages[k]}</div>`;
      const cv = await html2canvas(box.firstChild, {scale: 2, backgroundColor: '#ffffff'});
      if (k) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 595.28, 841.89);
    }
    const blob = pdf.output('blob'), name = (p.name || 'mandir').replace(/[\\/:*?"<>|]+/g, ' ').trim() + ' - estimate.pdf';
    const dl = window.claude ? await window.claude.use('downloads') : null;
    if (dl){ try { await dl.save({filename: name, data: blob}); S.msg = '✓ PDF તૈયાર: ' + esc(name); } catch (e){ S.msg = e && e.code === 'declined' ? 'PDF સેવ ના કરી.' : 'આ જગ્યાએ PDF સેવ થઈ શકતી નથી.'; } }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); S.msg = '✓ PDF તૈયાર: ' + esc(name); }
  } catch (e){ S.msg = 'PDF બનાવવા માં તકલીફ: ' + esc(e.message || e); }
  box.remove(); render();
}

/* ---- cloud save (same projects on phone and computer) ---- */
let cloud = null, cloudT = 0;
const _save = save;
save = function(){ _save(); if (cloud){ clearTimeout(cloudT); cloudT = setTimeout(() => cloud.set({projects: JSON.stringify(S.projects), cur: S.cur, at: Date.now()}).catch(() => {}), 1200); } };
(async () => { try {
  if (!window.claude) return; const db = await claude.use('db'), user = await claude.use('user'); if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  const ref = db.doc('data/users/' + uid + '/app'); const snap = await ref.get();
  if (snap.exists){ const d = snap.data(); const pr = JSON.parse(d.projects || '[]'); if (pr.length){ S.projects = pr; S.cur = Math.min(d.cur || 0, pr.length - 1); } }
  cloud = ref; S.cloud = true; render();
} catch (e) {} })();

/* ---- events for the new controls ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-copy],[data-pdf],[data-askdel],[data-nodel],[data-fstatus],[data-grp],[data-act="pdfcur"]'); if (!t) return;
  e.stopImmediatePropagation(); const d = t.dataset;
  if (d.copy !== undefined){ const cp = JSON.parse(JSON.stringify(S.projects[+d.copy])); cp.name += ' (કોપી)'; cp.date = todayStr(); S.projects.push(cp); }
  else if (d.pdf !== undefined) return makePdf(+d.pdf);
  else if (d.act === 'pdfcur') return makePdf(S.cur);
  else if (d.askdel !== undefined) S.confirmDel = +d.askdel;
  else if (d.nodel) S.confirmDel = null;
  else if (d.fstatus) S.fStatus = d.fstatus;
  else if (d.grp){ S.grp = S.grp || {}; S.grp[d.grp] = !S.grp[d.grp]; }
  S.msg = ''; render();
}, true);
document.addEventListener('input', e => { if (e.target.dataset.q){ S.q = e.target.value; render(); const el = document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
document.addEventListener('click', e => { if (e.target.closest('[data-del]')) S.confirmDel = null; }, true);

S.view = 'home';
render();
